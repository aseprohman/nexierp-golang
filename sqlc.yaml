version: "2"
sql:
  # Satu entry per package inti. Schema = dump schema live (db/schema.sql)
  # yang dihasilkan agent migrasi dari goose-up segar + rekonsiliasi.
  - engine: "postgresql"
    schema: "db/schema.sql"
    queries: "db/queries/auth"
    gen:
      go:
        package: "gen"
        out: "internal/core/auth/repository/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
