      description: reorderRowViewSchema — daftar reorder (F09/M27); qtySaran = maks − saldo efektif.
      properties:
        idInvProduk: { type: integer, minimum: 1 }
        kodeProduk: { type: string }
        namaProduk: { type: string }
        stokMinimum: { type: integer, minimum: 0 }
        stokMaksimum: { type: [integer, 'null'], minimum: 0 }
        saldoEfektif: { type: integer }
        qtySaran: { type: integer, minimum: 0 }
        namaGudang: { type: [string, 'null'] }
        reorderAktif: { type: boolean }
    ExpiringRowView:
      type: object
