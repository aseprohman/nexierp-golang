# =============================================================================
# api/openapi/inventory.yaml — kontrak kawat 114 endpoint modul inventory.
# Sumber fakta (READ-ONLY):
#   - apps/api/src/modules/inv/controllers/{dashboard,laporan,master,operasi,
#     pengaturan,stok}/*.controller.ts (NestJS)
#   - packages/schemas/src/inv/{schemas,views,tipe}.ts (zod — satu sumber
#     DTO/view; field & ejaan camelCase PERSIS z.infer)
#   - kanonik izin: /tmp/g2/inv-routes.txt 114 baris
#     `method uri_pattern -> permission_code` — path & method 1:1 dengannya.
#
# CATATAN PATH: paths di sini TANPA prefix global /api — GATEWAY menyisipkan
# /api di depan (padanan setGlobalPrefix("api") NestJS; guard RBAC mencocokkan
# uri_pattern inv_routes setelah prefix dibuang). Contoh: /inventory/master/produk
# diakses via <gateway>/api/inventory/master/produk.
#
# Envelope sukses PERSIS NestJS ({ data, meta? }):
#   - OK biasa     : { data }
#   - Halaman      : { data: [], meta: { page, limit, total, totalPages } }
#   - Mutasi tanpa payload / soft-delete: { data: { ok: true } }
# Error PERSIS ProblemExceptionFilter NestJS: problem+json RFC 7807.
# ==============================================================================
openapi: 3.1.0

info:
  title: NEXIERP API — Inventory
  version: 1.0.0
  description: |
    Kontrak kawat modul inventory: Dashboard (KPI/tren/nilai/backlog/reorder/
    expiring), Laporan (kartu stok, KPI §2.3, lapisan biaya FIFO,
    traceability), Master (produk, varian/induk, kategori, unit & konversi,
    kemasan, gudang, lokasi, lot, atribut), Operasi (gerakan stok multi-langkah
    + reservasi, dokumen mutasi ber-approval, penyesuaian ber-approval,
    picking agregat, jadwal cycle count), Pengaturan CFG-INV-01..13, Stok
    (saldo READMODEL, ATP, recompute).

    ## Prefix gateway
    Semua path di dokumen ini TANPA prefix `/api` — **gateway menyisipkan
    `/api`** di depan (setGlobalPrefix NestJS). `/inventory/master/produk` di
    sini = `/api/inventory/master/produk` di jaringan.

    ## Autentikasi (keduanya didukung — OR)
    1. `Authorization: Bearer <jwt>` (bearerAuth) — guard membaca header.
    2. Cookie sesi httpOnly `nexierp_at` (cookieAuth) — dipakai browser FE.
    Seluruh 114 endpoint diwajibkan sesi aktif + permission route-centric:
    guard mencocokkan `(method, path)` → `permission_code` di inv_routes
    (`inventory.<fitur>.<action>`); tanpa @RequirePermission per-handler.

    ## Envelope & error
    Sukses = `{"data": ...}` (+`meta` untuk halaman). Error = dokumen RFC 7807
    `application/problem+json` (schema `Problem`): 400 VAL-400 (zod/param),
    401/403 (auth/permission), 404 INV-018 (TIDAK_DITEMUKAN), 409 transisi
    status/bentrok unik/versi (INV-002/011/012/016/017, VERSI_BENTROK),
    410-less stok & kebijakan = 400/409 dengan kode INV-001..INV-022
    (lihat tabel di bawah). SoD approval (penyusun ≠ penyetuju) = 403/409.

    ## Kode error modul INV (problem+json `code`)
    INV-001 NOMOR_TIDAK_TERSAMPAH, INV-002 HAPUS_DIBLOKIR, INV-003
    GERAKAN_TIDAK_SAH, INV-004 SOD_DILANGGAR, INV-005 ALASAN_WAJIB, INV-006
    KONFIGURASI_TIDAK_SAH, INV-007 LOT_WAJIB, INV-008 LOT_KEDALUWARSA, INV-009
    SERIAL_SUDAH_TERPAKAI, INV-010 SALDO_TIDAK_CUKUP, INV-011
    KATEGORI_SUDAH_BERMUTASI, INV-012 GERAKAN_FINAL, INV-013
    KEPUTUSAN_BACKORDER_WAJIB, INV-014 LOKASI_MASIH_BERISI, INV-015
    BARCODE_TIDAK_COCOK, INV-016 KOMBINASI_TIDAK_LENGKAP, INV-017
    VERSI_BENTROK, INV-018 TIDAK_DITEMUKAN, INV-019 LANGKAH_BELUM_SELESAI,
    INV-020 JENIS_OPERASI_TIDAK_SAH, INV-021 LOKASI_TIDAK_DIIZINKAN, INV-022
    GR_TIDAK_ELIGIBEL.

    ## Konvensi
    - Qty SELALU integer (aturan K-06 — presisi via UOM terkecil); money =
      numeric(18,4) → number; rasio numeric(18,6) → number > 0.
    - Optimistic locking `version` wajib di body PATCH/PUT transaksional
      (bentrok = 409 INV-017/VERSI_BENTROK).
    - Status sukses POST: 201 untuk create/generate (produk, induk, varian,
      master, gerakan, mutasi, penyesuaian, jadwal, mutasi-dari-GR); 200 untuk
      aksi (konfirmasi/batal/reservasi/ajukan/keputusan/langkah/recompute).

servers:
  - url: /
    description: Gateway menyisipkan prefix /api di depan setiap path di bawah.
  - url: http://localhost:3101/api
    description: Dev langsung ke API (prefix /api disertakan di URL server).

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: dashboard
    description: KPI, tren harian, nilai persediaan, backlog, reorder, expiring (inventory.dashboard.*).
  - name: laporan
    description: Kartu stok, KPI §2.3, lapisan biaya FIFO, traceability, nilai, expiring, backlog, reorder (inventory.laporan.*).
  - name: master-produk
    description: Produk, varian + produk induk, kategori, atribut varian (inventory.master.*).
  - name: master-unit
    description: Unit ukur, konversi satuan, kemasan (inventory.master.*).
  - name: master-gudang
    description: Gudang, lokasi stok, lot/serial (inventory.master.*).
  - name: operasi-gerakan
    description: Gerakan stok multi-langkah + reservasi (inventory.operasi.*).
  - name: operasi-mutasi
    description: Dokumen mutasi barang ber-approval + generate dari GR PUR (inventory.operasi.*).
  - name: operasi-penyesuaian
    description: Penyesuaian stok ber-approval + resolver barcode (inventory.operasi.*).
  - name: operasi-picking
    description: Picking agregat per nomor dokumen + tahapan eksekusi (inventory.operasi.*).
  - name: operasi-jadwal
    description: Jadwal hitung (cycle count) + generate penyesuaian (inventory.operasi.*).
  - name: pengaturan
    description: Parameter kebijakan CFG-INV-01..13 (inventory.pengaturan.*).
  - name: stok
    description: Saldo stok READMODEL, ATP, recompute (inventory.stok.*).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token pada header Authorization (guard JwtAuthGuard).
    cookieAuth:
      type: apiKey
      in: cookie
      name: nexierp_at
      description: Cookie sesi httpOnly `nexierp_at` — dipakai browser FE.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Nomor halaman (default 1).
      schema: { type: integer, minimum: 1, default: 1 }
    Limit20:
      name: limit
      in: query
      required: false
      description: Ukuran halaman (1..200, default 20).
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Sort:
      name: sort
      in: query
      required: false
      description: 'Urutan — `field` ASC atau `-field` DESC (regex ^-?\w+$).'
      schema: { type: string, pattern: '^-?\w+$' }
    Search:
      name: search
      in: query
      required: false
      description: Pencarian teks (ILIKE, maks 100 char) — kolom sesuai endpoint.
      schema: { type: string, maxLength: 100 }
    StatusFilter:
      name: status
      in: query
      required: false
      description: Filter status hidup (kosakata status baris target).
      schema: { type: string, maxLength: 60 }
    JenisFilter:
      name: jenis
      in: query
      required: false
      description: Filter jenis (kosakata jenis baris target; mutasi menerima multi koma-terpisah).
      schema: { type: string, maxLength: 60 }
    IdGudangFilter:
      name: idGudang
      in: query
      required: false
      description: Filter id gudang.
      schema: { type: integer, minimum: 1 }
    IdLokasiFilter:
      name: idLokasi
      in: query
      required: false
      description: Filter id lokasi stok.
      schema: { type: integer, minimum: 1 }
    IdProdukFilter:
      name: idProduk
      in: query
      required: false
      description: Filter id produk.
      schema: { type: integer, minimum: 1 }
    IdParam:
      name: id
      in: path
      required: true
      description: 'Path `:id` numerik — coerce string → int positif (400 VAL-400 bila bukan angka; 404 INV-018 bila absen).'
      schema: { type: integer, minimum: 1 }
    KodeParam:
      name: kode
      in: path
      required: true
      description: 'Path `:kode` — barcode/teks resolve (produk / kemasan / lot).'
      schema: { type: string, minLength: 1, maxLength: 50 }
    NomorDokumenParam:
      name: nomorDokumen
      in: path
      required: true
      description: 'Path `:nomorDokumen` — nomor dokumen gerakan picking (mis. `GR/2601/0001`).'
      schema: { type: string, minLength: 1 }

  responses:
    Problem400:
      description: 'Body/query/param tidak sah — problem+json VAL-400 (rule zod: lihat deskripsi operation).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem401:
      description: Tidak terautentikasi — Bearer/cookie sesi absen atau kedaluwarsa (AUTH-401).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem403:
      description: Permission kurang — guard route-centric mencocokkan (method, path) → permission_code inv_routes (RBAC-403); SoD approval dilanggar (INV-004).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem404:
      description: Resource tidak ditemukan — INV-018 TIDAK_DITEMUKAN (atau induk FK absen).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem409:
      description: Bentrok — transisi status ilegal, duplikat unik, versi stale, atau kebijakan domain (INV-002/011/012/015/016/017, VERSI_BENTROK).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------------------------------------
  # Schemas — kosakata enum (cermin packages/schemas/src/inv/tipe.ts)
  # --------------------------------------------------------------------------
  schemas:
    StatusAktif:
      type: string
      enum: [AKTIF, NONAKTIF]
      description: enum_status_aktif (master INV).
    TipeProduk:
      type: string
      enum: [BARANG, JASA, BAHAN]
      description: enum_tipe_produk.
    Pelacakan:
      type: string
      enum: [TANPA, LOT, SERIAL]
      description: enum_pelacakan.
    MetodeValuasi:
      type: string
      enum: [STANDAR, AVCO, FIFO]
      description: enum_metode_valuasi (CFG-INV-06).
    SistemValuasi:
      type: string
      enum: [PERPETUAL, PERIODIK]
      description: enum_sistem_valuasi (CFG-INV-07).
    JenisLokasi:
      type: string
      enum: [INTERNAL, VENDOR, CUSTOMER, PRODUKSI, SCRAP]
      description: enum_jenis_lokasi.
    JenisGerakan:
      type: string
      enum: [PENERIMAAN, PENGIRIMAN, TRANSFER_INTERNAL, PRODUKSI, SCRAP, PENYESUAIAN]
      description: enum_jenis_gerakan (RETUR menyusul via ALTER TYPE).
    StatusGerakan:
      type: string
      enum: [DRAFT, MENUNGGU_STOK, TERJADWAL, SEBAGIAN, SELESAI, BATAL]
      description: enum_status_gerakan (§4.2 blueprint v2). Pseudo-filter `TERBUKA` = non-final.
    StatusLotSerial:
      type: string
      enum: [AKTIF, KEDALUWARSA, HABIS]
      description: enum_status_lot_serial.
    JenisPenyesuaian:
      type: string
      enum: [PENYESUAIAN, CYCLE_COUNT, SCRAP]
      description: enum_jenis_penyesuaian.
    StatusPenyesuaian:
      type: string
      enum: [DRAFT, MENUNGGU_PERSETUJUAN, DISETUJUI, DITOLAK, DIBATALKAN]
      description: enum_status_penyesuaian (§4.2).
    StatusMutasi:
      type: string
      enum: [DRAFT, MENUNGGU_PERSETUJUAN, DISETUJUI, DITOLAK, DIBATALKAN, SELESAI]
      description: enum_status_mutasi (patch 07).
    TipeAtribut:
      type: string
      enum: [PILIHAN, BEBAS]
      description: enum_tipe_atribut (varian).
    StatusReservasi:
      type: string
      enum: [TIDAK, TERRESERVASI]
      description: enum_status_reservasi (reservasi per picking).
    FrekuensiHitung:
      type: string
      enum: [HARIAN, MINGGUAN, BULANAN, TRIWULAN]
      description: enum_frekuensi_hitung (cycle count).
    KelompokNilai:
      type: string
      enum: [KATEGORI, GUDANG]
      description: Jenis kelompok laporan nilai persediaan.
    KpiNama:
      type: string
      enum: [AKURASI_STOK, KETEPATAN_PENERIMAAN, KETEPATAN_PENGIRIMAN, PENYESUAIAN_TAK_TERJELASKAN]
      description: Empat KPI §2.3.
    KpiSatuan:
      type: string
      enum: [PERSEN, NILAI]
      description: Satuan nilai KPI.
    ArahJejak:
      type: string
      enum: [MASUK, KELUAR]
      description: Arah baris traceability.
    BarcodeSumber:
      type: string
      enum: [PRODUK, KEMASAN, LOT]
      description: Sumber resolve barcode terpadu (D-37).
    Keputusan:
      type: string
      enum: [SETUJUI, TOLAK]
      description: Keputusan approval (TOLAK wajib alasan ≥3 char).
    CfgValueType:
      type: string
      enum: [string, number, boolean, json]
      description: Bentuk nilai parameter CFG-INV.

    # ------------------------------------------------------------------
    # Infrastruktur — envelope & problem
    # ------------------------------------------------------------------
    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      description: Metadata halaman jawaban (dihitung backend — pageMetaSchema).
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      description: Dokumen problem+json RFC 7807 kernel (ProblemExceptionFilter).
      properties:
        type:
          type: string
          example: 'urn:nexierp:problem:INV-010'
        title:
          type: string
          description: Reason phrase RFC 9110 (mis. "Conflict").
        status:
          type: integer
          example: 400
        detail:
          type: string
          description: Penjelasan manusiawi (kode kosakata modul, mis. INV-010 SALDO_TIDAK_CUKUP).
        instance:
          type: string
          description: URL request (dengan prefix /api).
          example: /api/inventory/operasi/gerakan/1/konfirmasi
        code:
          type: string
          description: 'Kode error bisnis: VAL-400, AUTH-401, RBAC-403, INV-001..INV-022.'
        errors:
          type: array
          description: Detail pelanggaran validasi per field (opsional — 400 zod).
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    OkData:
      type: object
      required: [ok]
      description: 'Respons mutasi tanpa payload / soft-delete — konvensi controller inv (`{ ok: true }`).'
      properties:
        ok: { type: boolean, enum: [true] }

    # ------------------------------------------------------------------
    # Master views (cermin views.ts)
    # ------------------------------------------------------------------
    KategoriView:
      type: object
      required: [id, idKategoriInduk, namaInduk, nama, metodeValuasi, sistemValuasi, kebijakanPelacakan, kebijakanKedaluwarsa, status, punyaMutasi, version, createdAt, updatedAt]
      description: kategoriProdukViewSchema — kategori produk + kebijakan warisan. punyaMutasi = dasar blokir ubah metode valuasi (INV-BR10/INV-011).
      properties:
        id: { type: integer, minimum: 1 }
        idKategoriInduk: { type: [integer, 'null'], minimum: 1 }
        namaInduk: { type: [string, 'null'] }
        nama: { type: string, maxLength: 100 }
        metodeValuasi: { $ref: '#/components/schemas/MetodeValuasi' }
        sistemValuasi: { $ref: '#/components/schemas/SistemValuasi' }
        kebijakanPelacakan: { $ref: '#/components/schemas/Pelacakan' }
        kebijakanKedaluwarsa: { type: boolean }
        status: { $ref: '#/components/schemas/StatusAktif' }
        punyaMutasi: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, description: ISO 8601 }
        updatedAt: { type: string, description: ISO 8601 }
    UnitView:
      type: object
      required: [id, kode, nama, kategoriUom, status, version, createdAt, updatedAt]
      description: unitUkurViewSchema — unit ukur (UOM).
      properties:
        id: { type: integer, minimum: 1 }
        kode: { type: string, maxLength: 50, description: 'huruf/angka/. _ -' }
        nama: { type: string, maxLength: 100 }
        kategoriUom: { type: string, maxLength: 50 }
        status: { $ref: '#/components/schemas/StatusAktif' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, description: ISO 8601 }
        updatedAt: { type: string, description: ISO 8601 }
    UnitKonversiView:
      type: object
      required: [id, idUnitDari, kodeUnitDari, namaUnitDari, idUnitKe, kodeUnitKe, namaUnitKe, faktor, status, version, createdAt, updatedAt]
      description: unitKonversiViewSchema — 1 unitDari = faktor × unitKe (label unit dari join).
      properties:
        id: { type: integer, minimum: 1 }
        idUnitDari: { type: integer, minimum: 1 }
        kodeUnitDari: { type: string }
        namaUnitDari: { type: string }
        idUnitKe: { type: integer, minimum: 1 }
        kodeUnitKe: { type: string }
        namaUnitKe: { type: string }
        faktor: { type: number, exclusiveMinimum: 0, description: rasio numeric(18,6) }
        status: { $ref: '#/components/schemas/StatusAktif' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, description: ISO 8601 }
        updatedAt: { type: string, description: ISO 8601 }
    NilaiAtributView:
      type: object
      required: [id, idInvAtribut, kodeAtribut, namaAtribut, nilai, urutan, status, version]
      description: nilaiAtributViewSchema — nilai atribut varian (ringkas, dipakai produk & picker).
      properties:
        id: { type: integer, minimum: 1 }
        idInvAtribut: { type: integer, minimum: 1 }
        kodeAtribut: { type: string }
        namaAtribut: { type: string }
        nilai: { type: string, maxLength: 100 }
        urutan: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/StatusAktif' }
        version: { type: integer, minimum: 1 }
    AtributView:
      type: object
      required: [id, kode, nama, tipeInput, status, version, createdAt, updatedAt]
      description: atributViewSchema — atribut varian.
      properties:
        id: { type: integer, minimum: 1 }
        kode: { type: string, maxLength: 50, description: 'huruf/angka/. _ -' }
        nama: { type: string, maxLength: 100 }
        tipeInput: { $ref: '#/components/schemas/TipeAtribut' }
        status: { $ref: '#/components/schemas/StatusAktif' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, description: ISO 8601 }
        updatedAt: { type: string, description: ISO 8601 }
    ProdukIndukAtributBaris:
      type: object
      required: [idInvAtribut, kodeAtribut, namaAtribut, wajib, urutan]
      description: Baris konfigurasi atribut pada produk induk (view).
      properties:
        idInvAtribut: { type: integer, minimum: 1 }
        kodeAtribut: { type: string }
        namaAtribut: { type: string }
        wajib: { type: boolean }
        urutan: { type: integer, minimum: 0 }
    ProdukIndukView:
      type: object
      required: [id, kode, nama, deskripsi, idInvKategoriProduk, namaKategori, idInvUnitUkur, kodeUnit, hargaJual, hargaBiaya, stokMinimum, status, jumlahVarian, atribut, version, createdAt, updatedAt]
      description: produkIndukViewSchema — induk varian = produk penuh; harga jadi default pewarisan varian (PATCH 06).
      properties:
        id: { type: integer, minimum: 1 }
        kode: { type: string, maxLength: 50 }
        nama: { type: string, maxLength: 100 }
        deskripsi: { type: [string, 'null'], maxLength: 5000 }
        idInvKategoriProduk: { type: integer, minimum: 1 }
        namaKategori: { type: string }
        idInvUnitUkur: { type: integer, minimum: 1 }
        kodeUnit: { type: string }
        hargaJual: { type: [number, 'null'], minimum: 0, description: money numeric(18,4) }
        hargaBiaya: { type: [number, 'null'], minimum: 0 }
        stokMinimum: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/StatusAktif' }
        jumlahVarian: { type: integer, minimum: 0 }
        atribut:
          type: array
          items: { $ref: '#/components/schemas/ProdukIndukAtributBaris' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, description: ISO 8601 }
        updatedAt: { type: string, description: ISO 8601 }
    ProdukVarianAtributBaris:
      type: object
      required: [kodeAtribut, namaAtribut, nilai]
      description: Pasangan nilai atribut varian (untuk tampilan katalog).
      properties:
        kodeAtribut: { type: string }
        namaAtribut: { type: string }
        nilai: { type: string }
    ProdukView:
      type: object
      required: [id, kodeProduk, nama, tipe, idInvKategoriProduk, namaKategori, idInvUnitUkur, kodeUnit, idInvProdukInduk, kodeInduk, kunciKombinasi, atribut, jejakStok, barcode, hargaJual, hargaBiaya, stokMinimum, stokMaksimum, reorderAktif, adalahIndukVarian, beratGram, volumeCm3, keterangan, status, saldoOnHand, version, createdAt, updatedAt]
      description: produkViewSchema — SKU produk (sederhana ATAU varian). kunciKombinasi kanonik `WARNA:Merah|UKURAN:XL`.
      properties:
        id: { type: integer, minimum: 1 }
        kodeProduk: { type: string, maxLength: 50, description: SKU unik — huruf/angka/. _ - }
        nama: { type: string, maxLength: 100 }
        tipe: { $ref: '#/components/schemas/TipeProduk' }
        idInvKategoriProduk: { type: integer, minimum: 1 }
        namaKategori: { type: string }
        idInvUnitUkur: { type: integer, minimum: 1 }
        kodeUnit: { type: string }
        idInvProdukInduk: { type: [integer, 'null'], minimum: 1, description: 'NULL = produk sederhana' }
        kodeInduk: { type: [string, 'null'] }
        kunciKombinasi: { type: [string, 'null'] }
        atribut:
          type: array
          items: { $ref: '#/components/schemas/ProdukVarianAtributBaris' }
        jejakStok: { type: boolean, description: 'Jasa = false (tanpa gerakan)' }
        barcode: { type: [string, 'null'], maxLength: 50 }
        hargaJual: { type: [number, 'null'], minimum: 0 }
        hargaBiaya: { type: [number, 'null'], minimum: 0 }
        stokMinimum: { type: integer, minimum: 0 }
        stokMaksimum: { type: [integer, 'null'], minimum: 0 }
        reorderAktif: { type: boolean }
        adalahIndukVarian: { type: boolean, description: Template induk varian (D-17) }
        beratGram: { type: [integer, 'null'], minimum: 0 }
        volumeCm3: { type: [integer, 'null'], minimum: 0 }
        keterangan: { type: [string, 'null'], maxLength: 5000 }
        status: { $ref: '#/components/schemas/StatusAktif' }
