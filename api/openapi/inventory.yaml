        - $ref: '#/components/schemas/GudangCreate'
      properties:
        version: { type: integer, minimum: 1 }
    LokasiCreate:
      type: object
      required: [kode, nama]
      description: lokasiStokCreateSchema — kode 1..50 (huruf/angka/. _ -); jenis INTERNAL wajib punya idInvGudang (INV-BR03/pasangan lokasi sah).
      properties:
        kode: { type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9_.-]+$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
