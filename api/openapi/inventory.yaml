        masuk: { type: integer, minimum: 0 }
        keluar: { type: integer, minimum: 0 }
        nilaiMasuk: { type: number, description: Σ nilai_persatuan × qty_selesai hari itu; 0 bila tanpa nilai }
        nilaiKeluar: { type: number }
    NilaiRowView:
      type: object
      required: [kelompok, jenisKelompok, jumlahSku, totalQty, totalNilai]
      description: nilaiPersediaanRowViewSchema — nilai persediaan per kategori/gudang (F14).
      properties:
        kelompok: { type: string }
        jenisKelompok: { $ref: '#/components/schemas/KelompokNilai' }
        jumlahSku: { type: integer, minimum: 0 }
        totalQty: { type: integer, minimum: 0 }
        totalNilai: { type: number }
    BacklogRowView:
      type: object
      required: [jenis, status, jumlah, totalQty]
      description: backlogRowViewSchema — gerakan terbuka per jenis×status (F14).
      properties:
        jenis: { $ref: '#/components/schemas/JenisGerakan' }
        status: { $ref: '#/components/schemas/StatusGerakan' }
