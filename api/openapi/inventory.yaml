        namaLangkah3: { type: [string, 'null'], maxLength: 100 }
        idLokasiSumberDefault: { type: [integer, 'null'], minimum: 1 }
        idLokasiTujuanDefault: { type: [integer, 'null'], minimum: 1 }
        status: { $ref: '#/components/schemas/StatusAktif' }
    JenisOperasiUpdate:
      type: object
      description: jenisOperasiUpdateSchema — create parsial + version wajib.
      allOf:
        - $ref: '#/components/schemas/JenisOperasiCreate'
