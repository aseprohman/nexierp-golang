      description: expiringRowViewSchema — lot mendekati/lewat kedaluwarsa (FEFO, ambang CFG-INV-12).
      properties:
        idInvLotSerial: { type: integer, minimum: 1 }
        kodeLot: { type: string }
        idInvProduk: { type: integer, minimum: 1 }
        kodeProduk: { type: string }
        namaProduk: { type: string }
        tanggalKedaluwarsa: { type: string, description: ISO 8601 }
        status: { $ref: '#/components/schemas/StatusLotSerial' }
        qtyOnHand: { type: integer, minimum: 0 }
        nilaiPersediaan: { type: number }
        hariTersisa: { type: integer, description: Negatif = lewat }
    KartuStokRowView:
      type: object
      required: [tanggal, nomorDokumen, jenis, kodeLot, qtyMasuk, qtyKeluar, nilai, saldoBerjalan]
      description: kartuStokRowViewSchema — satu baris kartu stok (mutasi + saldo berjalan).
      properties:
        tanggal: { type: string, description: ISO 8601 }
        nomorDokumen: { type: string }
        jenis: { $ref: '#/components/schemas/JenisGerakan' }
        kodeLot: { type: [string, 'null'] }
        qtyMasuk: { type: integer, minimum: 0 }
        qtyKeluar: { type: integer, minimum: 0 }
        nilai: { type: number }
        saldoBerjalan: { type: integer, description: Sejak awal periode (server) }
    LapisanBiayaView:
      type: object
      required: [id, idInvProduk, kodeProduk, kodeLot, nomorDokumenMasuk, tanggalMasuk, qtyMasuk, qtyTerpakai, qtySisa, biayaPersatuan]
      description: lapisanBiayaViewSchema — lapisan biaya FIFO sisa (D-27, urut tertua).
      properties:
        id: { type: integer, minimum: 1 }
        idInvProduk: { type: integer, minimum: 1 }
        kodeProduk: { type: string }
        kodeLot: { type: [string, 'null'] }
        nomorDokumenMasuk: { type: string }
        tanggalMasuk: { type: string, description: ISO 8601 }
        qtyMasuk: { type: integer, minimum: 1 }
        qtyTerpakai: { type: integer, minimum: 0 }
        qtySisa: { type: integer, minimum: 0 }
        biayaPersatuan: { type: number }
    KpiRowView:
      type: object
      required: [kpi, label, nilai, satuan, target, jumlah, penyebut]
      description: kpiRowViewSchema — baris KPI §2.3 (nilai dijelaskan dari data; penyebut ≠ 0).
      properties:
        kpi: { $ref: '#/components/schemas/KpiNama' }
        label: { type: string }
        nilai: { type: number }
        satuan: { $ref: '#/components/schemas/KpiSatuan' }
        target: { type: string }
        jumlah: { type: number }
        penyebut: { type: number }
    TraceabilityRowView:
      type: object
      required: [arah, nomorDokumen, jenis, tanggal, kodeLot, qty, nilaiPersatuan, kodeLokasiLawan, namaLokasiLawan, jenisSumber, entityIdSumber]
      description: traceabilityRowViewSchema — satu baris jejak produk (naik-turun dari gerakan).
      properties:
        arah: { $ref: '#/components/schemas/ArahJejak' }
        nomorDokumen: { type: string }
        jenis: { $ref: '#/components/schemas/JenisGerakan' }
        tanggal: { type: string, description: ISO 8601 }
        kodeLot: { type: [string, 'null'] }
        qty: { type: integer, minimum: 1 }
        nilaiPersatuan: { type: [number, 'null'], minimum: 0 }
        kodeLokasiLawan: { type: string }
        namaLokasiLawan: { type: string }
        jenisSumber: { type: string }
        entityIdSumber: { type: [string, 'null'] }

    # ------------------------------------------------------------------
    # Pengaturan CFG-INV views
    # ------------------------------------------------------------------
    CfgInvParamView:
      type: object
      required: [paramKey, pertanyaan, nilai, opsi, valueType, version, updatedAt]
      description: cfgInvParamViewSchema — satu parameter CFG (pertanyaan bisnis + nilai efektif + opsi label).
      properties:
        paramKey: { type: string, description: 'CFG-INV-01..13' }
        pertanyaan: { type: string }
        nilai:
          description: Nilai efektif — bentuk bebas (string enum / angka / object ambang).
        opsi:
          type: [array, 'null']
          description: Opsi pilihan bila parameter bertipe pilihan.
          items:
            type: object
            required: [nilai, label]
            properties:
              nilai: { type: string }
              label: { type: string }
        valueType: { $ref: '#/components/schemas/CfgValueType' }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, description: ISO 8601 }
    CfgInvView:
      type: object
      required: [params]
      description: cfgInvViewSchema — seluruh parameter CFG-INV untuk UI pengaturan.
      properties:
        params:
          type: array
          items: { $ref: '#/components/schemas/CfgInvParamView' }
    CfgInvAmbang:
      type: object
      required: [ambangQty, ambangNilai]
      description: Nilai CFG-INV-09 (ambang approval).
      properties:
        ambangQty: { type: [integer, 'null'], minimum: 0 }
        ambangNilai: { type: [number, 'null'], minimum: 0 }
    CfgInvValues:
      type: object
      required: ["CFG-INV-01", "CFG-INV-02", "CFG-INV-03", "CFG-INV-04", "CFG-INV-05", "CFG-INV-06", "CFG-INV-07", "CFG-INV-08", "CFG-INV-09", "CFG-INV-10", "CFG-INV-12", "CFG-INV-13"]
      description: 'cfgInvValuesSchema — body PUT /inventory/pengaturan. Dependensi antar opsi (INV-BR06) divalidasi server: CFG-INV-02 ≠ NONAKTIF butuh CFG-INV-01 aktif; CFG-INV-08 = DI_ATAS_AMBANG butuh salah satu ambang CFG-INV-09.'
      properties:
        CFG-INV-01: { type: string, enum: [NONAKTIF, LOT_TERPILIH, WAJIB_TERPILIH], description: Pelacakan lot/serial }
        CFG-INV-02: { type: string, enum: [NONAKTIF, PERINGATAN, BLOKIR], description: Kebijakan kedaluwarsa }
        CFG-INV-03: { type: string, enum: ['1', '2', '3'], description: Jumlah langkah penerimaan }
        CFG-INV-04: { type: string, enum: ['1', '2', '3'], description: Jumlah langkah pengiriman }
        CFG-INV-05: { type: string, enum: [BACKORDER_OTOMATIS, TANYA_OPERATOR, TANPA_BACKORDER], description: Kebijakan backorder }
        CFG-INV-06: { $ref: '#/components/schemas/MetodeValuasi' }
        CFG-INV-07: { $ref: '#/components/schemas/SistemValuasi' }
        CFG-INV-08: { type: string, enum: [TANPA_APPROVAL, DI_ATAS_AMBANG, SEMUA], description: Mode approval penyesuaian }
        CFG-INV-09: { $ref: '#/components/schemas/CfgInvAmbang' }
        CFG-INV-10: { type: string, enum: [MANUAL_HARIAN, OTOMATIS], description: Mode reorder }
        CFG-INV-12: { type: integer, minimum: 0, maximum: 365, description: Ambang hari expiring }
        CFG-INV-13: { type: string, enum: [ON_HAND, ATP_KETAT, ATP_KETAT_BUFFER], description: Mode ATP }

    # ------------------------------------------------------------------
    # Request bodies (cermin schemas.ts — rule zod dipertahankan)
    # ------------------------------------------------------------------
    KategoriCreate:
      type: object
      required: [nama]
      description: kategoriProdukCreateSchema — nama 1..100; default metode STANDAR/PERPETUAL/TANPA; kedaluwarsa false; status AKTIF.
      properties:
        nama: { type: string, minLength: 1, maxLength: 100 }
        idKategoriInduk: { type: [integer, 'null'], minimum: 1 }
        metodeValuasi: { $ref: '#/components/schemas/MetodeValuasi' }
        sistemValuasi: { $ref: '#/components/schemas/SistemValuasi' }
        kebijakanPelacakan: { $ref: '#/components/schemas/Pelacakan' }
        kebijakanKedaluwarsa: { type: boolean }
        status: { $ref: '#/components/schemas/StatusAktif' }
    KategoriUpdate:
      type: object
      description: kategoriProdukUpdateSchema — create parsial + version wajib (If-Match). Ubah metode valuasi diblokir bila punya mutasi (INV-011).
      allOf:
        - $ref: '#/components/schemas/KategoriCreate'
      properties:
        version: { type: integer, minimum: 1 }
    UnitCreate:
      type: object
      required: [kode, nama]
      description: unitUkurCreateSchema — kode 1..50 (huruf/angka/. _ -), nama 1..100, kategoriUom default UNIT.
      properties:
        kode: { type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9_.-]+$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
        kategoriUom: { type: string, minLength: 1, maxLength: 50 }
        status: { $ref: '#/components/schemas/StatusAktif' }
    UnitUpdate:
      type: object
      description: unitUkurUpdateSchema — create parsial + version wajib.
      allOf:
        - $ref: '#/components/schemas/UnitCreate'
      properties:
        version: { type: integer, minimum: 1 }
    UnitKonversiCreate:
      type: object
      required: [idUnitDari, idUnitKe, faktor]
      description: unitKonversiCreateSchema — pasangan berarah (1 unitDari = faktor × unitKe); idUnitDari ≠ idUnitKe; kedua unit wajib satu kategori UOM (validasi service); faktor > 0.
      properties:
        idUnitDari: { type: integer, minimum: 1 }
        idUnitKe: { type: integer, minimum: 1 }
        faktor: { type: number, exclusiveMinimum: 0 }
        status: { $ref: '#/components/schemas/StatusAktif' }
    UnitKonversiUpdate:
      type: object
      description: unitKonversiUpdateSchema — create parsial + version wajib.
      allOf:
        - $ref: '#/components/schemas/UnitKonversiCreate'
      properties:
        version: { type: integer, minimum: 1 }
    AtributCreate:
      type: object
      required: [kode, nama]
      description: atributCreateSchema — kode 1..50 (huruf/angka/. _ -), nama 1..100, tipeInput default PILIHAN.
      properties:
        kode: { type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9_.-]+$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
        tipeInput: { $ref: '#/components/schemas/TipeAtribut' }
        status: { $ref: '#/components/schemas/StatusAktif' }
    AtributUpdate:
      type: object
      description: atributUpdateSchema — create parsial + version wajib.
      allOf:
        - $ref: '#/components/schemas/AtributCreate'
      properties:
        version: { type: integer, minimum: 1 }
    NilaiAtributCreate:
      type: object
      required: [idInvAtribut, nilai]
      description: nilaiAtributCreateSchema — nilai 1..100, urutan default 0, status default AKTIF.
      properties:
        idInvAtribut: { type: integer, minimum: 1 }
        nilai: { type: string, minLength: 1, maxLength: 100 }
        urutan: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/StatusAktif' }
    NilaiAtributUpdate:
      type: object
      description: nilaiAtributUpdateSchema — create parsial + version wajib.
      allOf:
        - $ref: '#/components/schemas/NilaiAtributCreate'
      properties:
        version: { type: integer, minimum: 1 }
    ProdukIndukCreate:
      type: object
      required: [kode, nama, idInvKategoriProduk, idInvUnitUkur]
      description: produkIndukCreateSchema — kode 1..50 (huruf/angka/. _ -), nama 1..100, deskripsi ≤5000.
      properties:
        kode: { type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9_.-]+$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
        deskripsi: { type: [string, 'null'], maxLength: 5000 }
        idInvKategoriProduk: { type: integer, minimum: 1 }
        idInvUnitUkur: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/StatusAktif' }
    ProdukIndukUpdate:
      type: object
      description: produkIndukUpdateSchema — create parsial + version wajib.
      allOf:
        - $ref: '#/components/schemas/ProdukIndukCreate'
      properties:
        version: { type: integer, minimum: 1 }
    IndukAtributItem:
      type: object
      required: [idInvAtribut]
      description: indukAtributItemSchema — baris konfigurasi atribut induk (wajib default true, urutan default 0).
      properties:
        idInvAtribut: { type: integer, minimum: 1 }
        wajib: { type: boolean }
        urutan: { type: integer, minimum: 0 }
    IndukAtributReplace:
      type: object
      required: [items, version]
      description: indukAtributReplaceSchema — REPLACE semua baris atribut induk (satu UoW); maks 20 atribut.
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/IndukAtributItem' }
        version: { type: integer, minimum: 1 }
    VarianNilaiItem:
      type: object
      required: [idInvAtribut, idInvNilaiAtribut]
      description: varianNilaiItemSchema — pasangan atribut-nilai varian.
      properties:
        idInvAtribut: { type: integer, minimum: 1 }
        idInvNilaiAtribut: { type: integer, minimum: 1 }
    VarianGenerate:
      type: object
      required: [kombinasi]
      description: varianGenerateSchema — kombinasi nilai atribut PILIHAN induk (1..200 pasangan; satu nilai per atribut wajib); harga opsional.
      properties:
        kombinasi:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/VarianNilaiItem' }
        hargaJual: { type: [number, 'null'], minimum: 0 }
        hargaBiaya: { type: [number, 'null'], minimum: 0 }
    VarianGenerateResult:
      type: object
      required: [dibuat]
      description: Hasil generate varian — SKU + kunci kombinasi kanonik per varian baru.
      properties:
        dibuat:
          type: array
          items:
            type: object
            required: [id, kodeProduk, kunciKombinasi]
            properties:
              id: { type: integer, minimum: 1 }
              kodeProduk: { type: string }
              kunciKombinasi: { type: string }
    VarianEntry:
      type: object
      required: [idInvProdukInduk, nilai]
      description: Entry varian tunggal (D-38) — kunci kanonik dibentuk app; nilai 1..20 pasangan.
      properties:
        idInvProdukInduk: { type: integer, minimum: 1 }
        nilai:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/VarianNilaiItem' }
    ProdukCreate:
      type: object
      required: [kodeProduk, nama, idInvKategoriProduk, idInvUnitUkur]
      description: produkCreateSchema — SKU 1..50 (huruf/angka/. _ -) unik (partial-unique DB); maks > min; JASA tidak boleh jejakStok; varian entry opsional (D-38).
      properties:
        kodeProduk: { type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9_.-]+$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
        tipe: { $ref: '#/components/schemas/TipeProduk' }
        idInvKategoriProduk: { type: integer, minimum: 1 }
        idInvUnitUkur: { type: integer, minimum: 1 }
        jejakStok: { type: boolean }
        barcode: { type: [string, 'null'], maxLength: 50 }
        hargaJual: { type: [number, 'null'], minimum: 0, maximum: 999999999999 }
        hargaBiaya: { type: [number, 'null'], minimum: 0, maximum: 999999999999 }
        stokMinimum: { type: integer, minimum: 0 }
        stokMaksimum: { type: [integer, 'null'], minimum: 0 }
        reorderAktif: { type: boolean }
        adalahIndukVarian: { type: boolean, description: Varian tidak boleh jadi induk }
        beratGram: { type: [integer, 'null'], minimum: 0 }
        volumeCm3: { type: [integer, 'null'], minimum: 0 }
        keterangan: { type: [string, 'null'], maxLength: 5000 }
        status: { $ref: '#/components/schemas/StatusAktif' }
        varian: { oneOf: [{ $ref: '#/components/schemas/VarianEntry' }, { type: 'null' }] }
    ProdukUpdate:
      type: object
      description: 'produkUpdateSchema — bentuk create (semua field opsional di server) TANPA kodeProduk (di-omit zod — SKU tidak dapat diubah; nilai yang terkirim diabaikan server) + version wajib (If-Match).'
      allOf:
        - $ref: '#/components/schemas/ProdukCreate'
      properties:
        version: { type: integer, minimum: 1 }
    GudangCreate:
      type: object
