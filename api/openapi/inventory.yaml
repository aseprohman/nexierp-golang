        idInvGudang: { type: [integer, 'null'], minimum: 1 }
        idLokasiInduk: { type: [integer, 'null'], minimum: 1 }
        status: { $ref: '#/components/schemas/StatusAktif' }
    LokasiUpdate:
      type: object
      description: lokasiStokUpdateSchema — create parsial + version wajib.
