        version: { type: integer, minimum: 1 }
    JadwalHitungCreate:
      type: object
      required: [kode, nama, idInvGudang]
      description: jadwalHitungCreateSchema — kode 1..50; frekuensi default BULANAN; hariEksekusi 0..28 (default 1); aktif default true.
      properties:
        kode: { type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9_.-]+$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
        idInvGudang: { type: integer, minimum: 1 }
        idInvLokasiStok: { type: [integer, 'null'], minimum: 1 }
        frekuensi: { $ref: '#/components/schemas/FrekuensiHitung' }
        hariEksekusi: { type: integer, minimum: 0, maximum: 28 }
        aktif: { type: boolean }
    JadwalHitungUpdate:
      type: object
      description: jadwalHitungUpdateSchema — create parsial + version wajib.
      allOf:
        - $ref: '#/components/schemas/JadwalHitungCreate'
      properties:
        version: { type: integer, minimum: 1 }
    GerakanCreate:
      type: object
      required: [jenis, idInvProduk, idInvUnitUkur, qtyDiminta, idLokasiSumber, idLokasiTujuan]
      description: gerakanCreateSchema — nomorDokumen DIBANGKITKAN SERVER (INV-BR01); qtyDiminta > 0 integer; sumber ≠ tujuan (INV-BR03); status default TERJADWAL.
      properties:
        jenis: { $ref: '#/components/schemas/JenisGerakan' }
        idInvProduk: { type: integer, minimum: 1 }
        idInvLotSerial: { type: [integer, 'null'], minimum: 1 }
        idInvUnitUkur: { type: integer, minimum: 1 }
        qtyDiminta: { type: integer, minimum: 1 }
        idLokasiSumber: { type: integer, minimum: 1 }
        idLokasiTujuan: { type: integer, minimum: 1 }
        tanggalJadwal: { type: [string, 'null'], minLength: 1, description: ISO 8601 }
        jenisSumber: { type: string, maxLength: 50 }
        entityIdSumber: { type: [string, 'null'], maxLength: 255 }
        status: { type: string, enum: [DRAFT, TERJADWAL, MENUNGGU_STOK] }
    GerakanKonfirmasi:
      type: object
      required: [qtySelesai]
      description: gerakanKonfirmasiSchema — qtySelesai > 0 (≤999.999.999); parsial boleh (SEBAGIAN), tuntas = SELESAI.
      properties:
        qtySelesai: { type: integer, minimum: 1, maximum: 999999999 }
        idInvLotSerial: { type: [integer, 'null'], minimum: 1 }
        nilaiPersatuan: { type: [number, 'null'], minimum: 0, maximum: 999999999999 }
    AlasanBatal:
      type: object
      required: [alasan]
      description: gerakanBatalSchema / penyesuaianBatalSchema / mutasiBatalSchema — alasan wajib 3..300 char (STD-06, INV-BR05).
      properties:
        alasan: { type: string, minLength: 3, maxLength: 300 }
    AjukanVersion:
      type: object
      required: [version]
      description: penyesuaianAjukanSchema / mutasiAjukanSchema — optimistic lock version.
      properties:
        version: { type: integer, minimum: 1 }
    KeputusanBody:
      type: object
      required: [keputusan]
      description: penyesuaianKeputusanSchema / mutasiKeputusanSchema — TOLAK wajib alasan ≥3 char (INV-BR04/BR05; SoD server-side).
      properties:
        keputusan: { $ref: '#/components/schemas/Keputusan' }
        alasan: { type: [string, 'null'], maxLength: 300 }
    PenyesuaianItem:
      type: object
      required: [idInvProduk, idInvLokasiStok, idInvUnitUkur, qtySistem, qtyHitung]
      description: 'penyesuaianItemSchema — qty ≥ 0 integer; qtySelisih dihitung server (hitung − sistem); kemasan: qtyKemasanHitung wajib bila idInvKemasan dipilih dan server menghitung ulang konversi (tolak 400 bila faktor tak cocok).'
      properties:
        idInvProduk: { type: integer, minimum: 1 }
        idInvLotSerial: { type: [integer, 'null'], minimum: 1 }
        idInvLokasiStok: { type: integer, minimum: 1 }
        idInvUnitUkur: { type: integer, minimum: 1 }
        idInvKemasan: { type: [integer, 'null'], minimum: 1 }
        qtyKemasanHitung: { type: [integer, 'null'], minimum: 0 }
        qtySistem: { type: integer, minimum: 0 }
        qtyHitung: { type: integer, minimum: 0 }
        biayaSatuan: { type: [number, 'null'], minimum: 0, maximum: 999999999999 }
    PenyesuaianCreate:
      type: object
      required: [idInvGudang, items]
      description: penyesuaianCreateSchema — header + items SATU transaksi; items 1..n; alasan wajib (≥3) utk jenis PENYESUAIAN & SCRAP; tanggal default now.
      properties:
        jenis: { $ref: '#/components/schemas/JenisPenyesuaian' }
        idInvGudang: { type: integer, minimum: 1 }
        tanggalDokumen: { type: [string, 'null'], minLength: 1, description: ISO 8601 }
        alasan: { type: [string, 'null'], maxLength: 300 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PenyesuaianItem' }
    PenyesuaianUpdate:
      type: object
      description: penyesuaianUpdateSchema — header parsial + items REPLACE penuh (opsional) + version wajib; hanya draft.
      properties:
        jenis: { $ref: '#/components/schemas/JenisPenyesuaian' }
        tanggalDokumen: { type: [string, 'null'], minLength: 1 }
        alasan: { type: [string, 'null'], maxLength: 300 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PenyesuaianItem' }
        version: { type: integer, minimum: 1 }
    MutasiItem:
      type: object
      required: [idInvProduk, idInvUnitUkur, qtyDiminta]
      description: mutasiItemSchema — qtyDiminta integer > 0.
      properties:
        idInvProduk: { type: integer, minimum: 1 }
        idInvLotSerial: { type: [integer, 'null'], minimum: 1 }
        idInvUnitUkur: { type: integer, minimum: 1 }
        qtyDiminta: { type: integer, minimum: 1 }
    MutasiCreate:
      type: object
      required: [jenis, idLokasiSumber, idLokasiTujuan, items]
      description: mutasiDokumenCreateSchema — jenis PENERIMAAN/PENGIRIMAN/TRANSFER_INTERNAL; lokasi milik HEADER (patch 08); items 1..200.
      properties:
        jenis: { type: string, enum: [PENERIMAAN, PENGIRIMAN, TRANSFER_INTERNAL] }
        idLokasiSumber: { type: integer, minimum: 1 }
        idLokasiTujuan: { type: integer, minimum: 1 }
        tanggalDokumen: { type: [string, 'null'], minLength: 1, description: ISO 8601 }
        alasan: { type: [string, 'null'], maxLength: 300 }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/MutasiItem' }
    MutasiUpdate:
      type: object
      description: mutasiDokumenUpdateSchema — create parsial + items REPLACE + version wajib; hanya draft.
      allOf:
        - $ref: '#/components/schemas/MutasiCreate'
      properties:
        version: { type: integer, minimum: 1 }
    MutasiDariGr:
      type: object
      required: [idPurPenerimaan]
      description: mutasiDariGrSchema — generate mutasi PENERIMAAN dari GR PUR DITERIMA (1 GR = 1 mutasi — uq_inv_mutasi_gr_ref); idLokasiTujuan kosong = warisi lokasi INTERNAL gudang GR (?? gudang PO); lokasi sumber = VENDOR pertama (INV-021/022).
      properties:
        idPurPenerimaan: { type: integer, minimum: 1 }
        idLokasiTujuan: { type: [integer, 'null'], minimum: 1 }
paths:
  # ==========================================================================
  # DASHBOARD (inventory.dashboard.*) — 6 endpoint
  # ==========================================================================
  /inventory/dashboard/ringkasan:
    get:
      operationId: getDashboardRingkasan
      tags: [dashboard]
      summary: KPI ringkasan inventory.
      description: 'Permission: inventory.dashboard.ringkasan. Angka KPI bisa dijelaskan dari seed — skuDiBawahMin, gerakanTerbuka, penyesuaianMenungguApproval, lotKedaluwarsa, reorderTertunda.'
      responses:
        '200':
          description: Ringkasan KPI dashboard.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RingkasanView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/dashboard/tren:
    get:
      operationId: getDashboardTren
      tags: [dashboard]
      summary: Tren gerakan harian (SELESAI).
      description: 'Permission: inventory.dashboard.tren. Qty + nilai arus masuk/keluar per hari untuk chart dashboard.'
      parameters:
        - name: hari
          in: query
          required: false
          description: Rentang hari (default 14, maks 90).
          schema: { type: integer, minimum: 1, maximum: 90, default: 14 }
      responses:
        '200':
          description: Baris tren harian.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrenRowView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/dashboard/nilai:
    get:
      operationId: getDashboardNilai
      tags: [dashboard]
      summary: Nilai persediaan per kelompok.
      description: 'Permission: inventory.dashboard.nilai. Breakdown kartu KPI nilai — Σ per kelompok = total nilai persediaan.'
      parameters:
        - name: kelompok
          in: query
          required: false
          description: '`kategori` (default) | `gudang`.'
          schema: { type: string, enum: [kategori, gudang] }
      responses:
        '200':
          description: Baris nilai per kelompok.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NilaiRowView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/dashboard/backlog:
    get:
      operationId: getDashboardBacklog
      tags: [dashboard]
      summary: Backlog gerakan terbuka per jenis×status.
      description: 'Permission: inventory.dashboard.backlog. Antrean transaksi — gerakan non-final dikelompokkan jenis×status.'
      responses:
        '200':
          description: Baris backlog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BacklogRowView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/dashboard/reorder:
    get:
      operationId: getDashboardReorder
      tags: [dashboard]
      summary: Daftar reorder produk di bawah minimum.
      description: 'Permission: inventory.dashboard.reorder. Produk reorder_aktif dengan saldo efektif < stok minimum; qty_saran = maks − efektif.'
      responses:
        '200':
          description: Baris reorder.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReorderRowView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/dashboard/expiring:
    get:
      operationId: getDashboardExpiring
      tags: [dashboard]
      summary: Lot mendekati/lewat kedaluwarsa.
      description: 'Permission: inventory.dashboard.expiring. FEFO — ambang hari dari CFG-INV-12.'
      parameters:
        - $ref: '#/components/parameters/IdGudangFilter'
      responses:
        '200':
          description: Baris expiring.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpiringRowView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }

  # ==========================================================================
  # LAPORAN (inventory.laporan.*) — 8 endpoint
  # ==========================================================================
  /inventory/laporan/kartu-stok:
    get:
      operationId: getLaporanKartuStok
      tags: [laporan]
      summary: Kartu stok per produk (opsi lokasi).
      description: 'Permission: inventory.laporan.kartustok. Mutasi + saldo berjalan sejak awal periode (server menghitung).'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit20'
        - $ref: '#/components/parameters/Sort'
        - name: idProduk
          in: query
          required: true
          description: Id produk (WAJIB).
          schema: { type: integer, minimum: 1 }
        - name: idLokasi
          in: query
          required: false
          description: Id lokasi stok (opsional).
          schema: { type: integer, minimum: 1 }
        - name: tanggalDari
          in: query
          required: true
          description: Awal periode (yyyy-mm-dd, WAJIB).
          schema: { type: string, minLength: 1 }
        - name: tanggalSampai
          in: query
          required: true
          description: Akhir periode (yyyy-mm-dd, WAJIB).
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Halaman baris kartu stok.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KartuStokRowView' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/laporan/expiring:
    get:
      operationId: getLaporanExpiring
      tags: [laporan]
      summary: Laporan lot expiring.
      description: 'Permission: inventory.laporan.expiring. Sama dengan dashboard expiring — ambang CFG-INV-12.'
      parameters:
        - $ref: '#/components/parameters/IdGudangFilter'
      responses:
        '200':
          description: Baris expiring.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpiringRowView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/laporan/nilai:
    get:
      operationId: getLaporanNilai
      tags: [laporan]
      summary: Laporan nilai persediaan per kelompok.
      description: 'Permission: inventory.laporan.nilai. Per kategori (default) ATAU gudang.'
      parameters:
        - name: kelompok
          in: query
          required: false
          description: '`kategori` (default) | `gudang`.'
          schema: { type: string, enum: [kategori, gudang] }
      responses:
        '200':
          description: Baris nilai.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NilaiRowView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/laporan/backlog:
    get:
      operationId: getLaporanBacklog
      tags: [laporan]
      summary: Laporan backlog picking.
      description: 'Permission: inventory.laporan.backlog. Gerakan terbuka per jenis×status.'
      responses:
        '200':
          description: Baris backlog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BacklogRowView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/laporan/reorder:
    get:
      operationId: getLaporanReorder
      tags: [laporan]
      summary: Laporan daftar reorder.
      description: 'Permission: inventory.laporan.reorder. Produk reorder_aktif di bawah minimum.'
      responses:
        '200':
          description: Baris reorder.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReorderRowView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/laporan/lapisan-biaya:
    get:
      operationId: getLaporanLapisanBiaya
      tags: [laporan]
      summary: Lapisan biaya FIFO sisa per produk.
      description: 'Permission: inventory.laporan.lapisanbiaya. Lapisan sisa urut tertua (D-27).'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit20'
        - $ref: '#/components/parameters/Sort'
        - name: idInvProduk
          in: query
          required: true
          description: Id produk (WAJIB — konsisten traceability).
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Halaman lapisan biaya.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LapisanBiayaView' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/laporan/kpi:
    get:
      operationId: getLaporanKpi
      tags: [laporan]
      summary: Empat KPI §2.3 pada periode.
      description: 'Permission: inventory.laporan.kpi. Akurasi stok, ketepatan penerimaan/pengiriman, penyesuaian tak terjelaskan — nilai dijelaskan dari data (penyebut dihitung); periode maks 1 tahun.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit20'
        - $ref: '#/components/parameters/Sort'
        - name: tanggalDari
          in: query
          required: true
          description: Awal periode (yyyy-mm-dd, WAJIB).
          schema: { type: string, minLength: 1 }
        - name: tanggalSampai
          in: query
          required: true
          description: Akhir periode (yyyy-mm-dd, WAJIB) — harus setelah tanggalDari.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Halaman baris KPI (4 baris).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KpiRowView' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /inventory/laporan/traceability:
    get:
      operationId: getLaporanTraceability
      tags: [laporan]
      summary: Jejak produk/lot (traceability).
      description: 'Permission: inventory.laporan.traceability. Naik-turun dari gerakan — minimal satu filter id (produk ATAU lot); lot menang atas produk.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit20'
        - $ref: '#/components/parameters/Sort'
        - name: idInvProduk
          in: query
          required: false
          description: Id produk (wajib bila tanpa lot).
          schema: { type: integer, minimum: 1 }
        - name: idInvLotSerial
          in: query
          required: false
          description: Id lot (menang atas produk).
          schema: { type: integer, minimum: 1 }
        - name: tanggalDari
          in: query
          required: false
          description: Awal periode (opsional).
          schema: { type: string, minLength: 1 }
        - name: tanggalSampai
          in: query
          required: false
          description: Akhir periode (opsional).
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Halaman baris jejak.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TraceabilityRowView' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  # ==========================================================================
  # MASTER — ATRIBUT VARIAN (inventory.master.*) — 9 endpoint
  # ==========================================================================
  /inventory/master/atribut:
    get:
      operationId: listAtribut
      tags: [master-produk]
      summary: Daftar atribut varian (paging).
      description: 'Permission: inventory.master.list. Halaman atribut hidup; query tidak sah = 400 VAL-400.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit20'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Halaman atribut.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AtributView' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      operationId: createAtribut
      tags: [master-produk]
      summary: Buat atribut varian.
      description: 'Permission: inventory.master.create. kode unik di antara baris hidup — duplikat = 409. Rule zod: kode 1..50 (huruf/angka/. _ -), nama 1..100, tipeInput default PILIHAN.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtributCreate' }
      responses:
        '201':
          description: Atribut dibuat (version 1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AtributView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
  /inventory/master/atribut/{id}:
    get:
      operationId: getAtribut
      tags: [master-produk]
      summary: Detail atribut.
      description: 'Permission: inventory.master.get. Soft delete aware — 404 INV-018 bila absen.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Detail atribut.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AtributView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
    patch:
      operationId: updateAtribut
      tags: [master-produk]
      summary: Ubah atribut.
      description: 'Permission: inventory.master.update. Semua field opsional KECALI version (wajib di body). Versi bentrok = 409 INV-017; kode duplikat = 409. Hasil: version +1.'
      parameters:
