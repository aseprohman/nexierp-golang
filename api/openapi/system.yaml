        '409': { $ref: '#/components/responses/Problem409' }

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token pada header Authorization (guard JwtAuthGuard).
    cookieAuth:
      type: apiKey
      in: cookie
      name: nexierp_at
      description: Cookie sesi httpOnly `nexierp_at` (backoffice) — dipakai browser FE, termasuk memuat media via /system/files/{id}/raw.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Nomor halaman (default 1).
      schema: { type: integer, minimum: 1, default: 1 }
    Limit20:
      name: limit
      in: query
      required: false
      description: Ukuran halaman (1..200, default 20).
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Limit50:
      name: limit
      in: query
      required: false
      description: Ukuran halaman (1..200, default 50).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Sort:
      name: sort
      in: query
      required: false
      description: 'Urutan — `field` ASC atau `-field` DESC (regex ^-?\w+$).'
      schema: { type: string, pattern: '^-?\w+$' }
    Search:
      name: search
      in: query
      required: false
      description: Pencarian teks (ILIKE) — kolom sesuai endpoint.
      schema: { type: string }
    FilterK:
      name: filter[k]
      in: query
      required: false
      description: 'Filter bebas key=value — bisa berulang, mis. filter[status]=AKTIF.'
      schema: { type: string }
    IdParam:
      name: id
      in: path
      required: true
      description: 'Path `:id` numerik — coerce string → int positif.'
      schema: { type: integer, minimum: 1 }
    UserIdParam:
      name: userId
      in: path
      required: true
      description: 'Path `:userId` — id user global (core_users), int positif.'
      schema: { type: integer, minimum: 1 }
    KeyParam:
      name: key
      in: path
      required: true
      description: ModuleKey (mis. `system`) — 404 bila tidak dikenal.
      schema: { type: string, minLength: 1 }
    IdModulClusterParam:
      name: idModulCluster
      in: path
      required: true
      description: Id baris core_cluster_modules (PK assignment) — wajib hidup.
      schema: { type: integer, minimum: 1 }
    KodeposParam:
      name: kodepos
      in: path
      required: true
      description: Kode pos PERSIS 5 digit angka (mis. 40115) — lain dari itu 400 VAL-400.
      schema: { type: string, pattern: '^\d{5}$' }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 'Nomor `version` hasil GET terakhir (mis. `"1"`) — tidak cocok = 412 SYS-412 / 409 WLY-002. Fallback: field `version` di body.'
      schema: { type: string, example: '"1"' }

  responses:
    Problem400:
      description: 'Body/query/param tidak sah — problem+json VAL-400 (rule zod: lihat deskripsi operation).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem401:
      description: Tidak terautentikasi — Bearer/cookie sesi absen atau kedaluwarsa (AUTH-401).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem403:
      description: Permission kurang — guard route-centric mencocokkan (method, path) → permission_code core_routes (RBAC-403).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem404:
      description: Resource tidak ditemukan / sudah soft-delete — SYS-404, NOTF-404, atau WLY-005.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem409:
      description: Bentrok — duplikat unik, transisi status ilegal, atau optimistic lock (SYS-409, WLY-002/003/004, VERSI_BENTROK, NAMA_DIPAKAI).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem412:
      description: If-Match ≠ version server — optimistic locking (SYS-412).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------------------------------------
  # Schemas — enum & primitif (cermin packages/schemas/src/core/enums.ts dst.)
  # --------------------------------------------------------------------------
  schemas:
    ModuleKey:
      type: string
      enum: [inventory, accounting, sales, finance, hr, crm, whatsapp-crm, book, pos, purchasing, asset, ess, fnb, system, payment-gateway, shipment, ecom, wf, ai-llm]
      description: core_module_key — 12 modul ERP + system + payment-gateway + shipment + ecom + wf + ai-llm.
    PermissionStatus:
      type: string
      enum: [active, disabled]
      description: core_permission_status.
    HttpMethod:
      type: string
      enum: [get, post, patch, put, delete]
      description: core_http_method — lowercase.
    AuditSeverity:
      type: string
      enum: [info, warning, critical]
      description: core_audit_severity.
    LoginFailReason:
      type: string
      enum: [unknown_user, wrong_password, locked, inactive, mfa_failed]
      description: core_login_fail_reason.
    MfaMethod:
      type: string
      enum: [totp]
      description: core_mfa_method — saat ini hanya totp.
    EnvCategory:
      type: string
      enum: [company, smtp, app, storage]
      description: core_env_category.
    EnvFieldType:
      type: string
      enum: [text, textarea, number, email, password, select, switch]
      description: Tipe field konfigurasi environment (payload jsonb core_app_settings).
    FileKind:
      type: string
      enum: [image, pdf, video, audio, file]
      description: Jenis file untuk pemilihan preview komponen web.
    PaketTier:
      type: string
      enum: [PS1, PS2, PS3]
      description: paket_tier core_tenants — tingkat paket langganan.
    StatusTenant:
      type: string
      enum: [PROVISI, AKTIF, DITANGGUHKAN, DITUTUP]
      description: status core_tenants — siklus hidup tenant.
    StatusAktif:
      type: string
      enum: [AKTIF, NONAKTIF]
      description: enum_status_aktif (master cluster/agama).
    JenisKota:
      type: string
      enum: [KOTA, KABUPATEN]
      description: Jenis kabupaten/kota (ck_core_kota_jenis, ddl/42).

    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      description: Metadata halaman jawaban (dihitung backend — pageMetaSchema).
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      description: Dokumen problem+json RFC 7807 kernel (ProblemExceptionFilter).
      properties:
        type:
          type: string
          example: 'urn:nexierp:problem:VAL-400'
        title:
          type: string
          description: Reason phrase RFC 9110 (mis. "Bad Request").
        status:
          type: integer
          example: 400
        detail:
          type: string
          description: Penjelasan manusiawi (kode kosakata modul, mis. SYS-409).
        instance:
          type: string
          description: URL request (dengan prefix /api).
          example: /api/system/roles
        code:
          type: string
          description: Kode error bisnis (VAL-400, SYS-404, SYS-412, RBAC-403, WLY-001..005, …).
        errors:
          type: array
          description: Detail pelanggaran validasi per field (opsional — 400 zod).
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    OkData:
      type: object
      required: [ok]
      description: Respons mutasi tanpa payload — konvensi controller system.
      properties:
        ok: { type: boolean, enum: [true] }
    DeletedId:
      type: object
      required: [id]
      description: Respons soft-delete master (agama/cluster) — id baris terhapus.
      properties:
        id: { type: integer, minimum: 1 }

    # ------------------------------------------------------------------ IAM
    Menu:
      type: object
      required: [id, text, urlPath, order, parent, icon, externalHref, idCoreModules]
      description: Baris menu (core_menus — data-driven nav; urlPath null = grup, externalHref = link eksternal).
      properties:
        id: { type: integer, minimum: 1 }
        text: { type: string, minLength: 1, maxLength: 100 }
        urlPath: { type: [string, 'null'], maxLength: 255 }
        order: { type: [integer, 'null'] }
        parent:
          type: [integer, 'null']
          minimum: 1
          description: Parent pada tree (self-FK core_menus.parent) — null = root.
        icon: { type: [string, 'null'], maxLength: 50 }
        externalHref: { type: [string, 'null'], maxLength: 255 }
        idCoreModules:
          type: [integer, 'null']
          minimum: 1
          description: Modul pemilik menu (FK core_modules) — null = header global/tanpa modul.
    MenuTreeNode:
      type: object
      required: [id, text, urlPath, order, icon, externalHref, idCoreModules, children]
      description: Node menu tree hasil penyusunan parent→children (read model nav per role).
      properties:
        id: { type: integer, minimum: 1 }
        text: { type: string, minLength: 1 }
        urlPath: { type: [string, 'null'] }
        order: { type: [integer, 'null'] }
        icon: { type: [string, 'null'] }
        externalHref: { type: [string, 'null'] }
        idCoreModules: { type: [integer, 'null'], minimum: 1 }
        children:
          type: array
          items: { $ref: '#/components/schemas/MenuTreeNode' }
    CreateMenu:
      type: object
      required: [text]
      description: Body POST menu — text wajib 1..100; urlPath null = grup; externalHref = link eksternal; cssClass ≤30; lainnya opsional/nullable.
      properties:
        text: { type: string, minLength: 1, maxLength: 100 }
        urlPath: { type: [string, 'null'], maxLength: 255 }
        parent: { type: [integer, 'null'], minimum: 1 }
        order: { type: [integer, 'null'] }
        cssClass: { type: [string, 'null'], maxLength: 30 }
        icon: { type: [string, 'null'], maxLength: 50 }
        externalHref: { type: [string, 'null'], maxLength: 255 }
        idCoreModules: { type: [integer, 'null'], minimum: 1 }
    UpdateMenu:
      type: object
      description: Body PATCH menu — createMenuSchema.partial() (semua opsional).
      allOf:
        - $ref: '#/components/schemas/CreateMenu'
    AssignMenus:
      type: object
      required: [roleId, menuIds]
      description: Body PUT /system/menus/{id}/roles — `roleId` body WAJIB sama dengan path; REPLACE set menu role.
      properties:
        roleId: { type: integer, minimum: 1 }
        menuIds:
          type: array
          items: { type: integer, minimum: 1 }
    PermissionView:
      type: object
      required: [id, name, description, moduleKey, status, isSystem, routeCount, createdAt]
      description: View satu SET permission (core_permissions — TANPA kolom code sejak ddl/21; permission code hanya di core_routes). routeCount = jumlah route junction.
      properties:
        id: { type: integer, minimum: 1 }
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Nama SET permission (mis. "system.users") — unik per modul.
        description: { type: [string, 'null'] }
        moduleKey:
          description: Modul pemilik SET (FK core_modules) — null = platform/lintas modul.
          allOf: [{ $ref: '#/components/schemas/ModuleKey' }]
          type: [string, 'null']
        status: { $ref: '#/components/schemas/PermissionStatus' }
        isSystem: { type: boolean }
        routeCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    CreatePermission:
      type: object
      required: [name]
      description: Body POST permission — nama SET wajib 1..150; identitas unik = (name, modul); description/moduleKey/featuresFolder opsional.
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string }
        moduleKey: { type: string }
        featuresFolder: { type: string }
    UpdatePermission:
      type: object
      description: Body PATCH permission — semua opsional; null = bersihkan (name/description/moduleKey/featuresFolder).
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 150 }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PermissionStatus' }
        moduleKey: { type: [string, 'null'] }
        featuresFolder: { type: [string, 'null'] }
    AssignRoutes:
      type: object
      required: [routeIds]
      description: Body PUT /system/permissions/{id}/routes — semantik REPLACE (array kosong = lepas semua).
      properties:
        routeIds:
          type: array
          items: { type: integer, minimum: 1 }
    RouteView:
      type: object
      required: [id, method, uriPattern, permissionCode, createdAt, updatedAt]
      description: Baris core_routes — business key (method, uri_pattern) unik; satu sumber permission code.
      properties:
        id: { type: integer, minimum: 1 }
        method: { $ref: '#/components/schemas/HttpMethod' }
        uriPattern:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^/'
          description: Path API TANPA prefix /api, per-segmen, segmen `:param`; tanpa spasi & query string (regex ^[^\s?]*$).
        permissionCode:
          type: string
          minLength: 1
          maxLength: 96
          description: 'Kode "{modul}.….{method}" (varchar(96), denormalisasi).'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    ModuleFeatureView:
      type: object
      required: [id, moduleKey, featuresFolder, isActive, isSystem]
      description: View fitur per modul (core_modules_features — folder fitur + siklus aktif).
      properties:
        id: { type: integer, minimum: 1 }
        moduleKey: { $ref: '#/components/schemas/ModuleKey' }
        featuresFolder:
          type: string
          minLength: 1
          maxLength: 50
          description: Identitas fitur — folder/slug nav (varchar(50), unik per modul).
        isActive: { type: boolean }
        isSystem: { type: boolean }
    SetFeatureActiveBody:
      type: object
      required: [isActive]
      description: Body PATCH /system/features/{id} — aktif/nonaktifkan fitur modul.
      properties:
        isActive: { type: boolean }
    ModuleRegistryView:
      type: object
      required: [id, key, name, tagline, tone, isCore, enabled, enabledAt, disabledAt, disabledBy]
      description: View registry modul (GET /system/modules — ModuleRegistry UI web).
      properties:
        id:
          type: integer
          minimum: 1
          description: PK numerik core_modules — dipakai menu-builder untuk set id_core_modules.
        key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        tagline: { type: string, minLength: 1 }
        tone: { type: string, minLength: 1 }
        isCore: { type: boolean }
        enabled: { type: boolean }
        enabledAt: { type: string, format: date-time }
        disabledAt: { type: [string, 'null'], format: date-time }
        disabledBy: { type: [string, 'null'] }
    ModuleEnabledResult:
      type: object
      required: [changed, key, enabled]
      description: Hasil enable/disable modul (POST /system/modules/{key}/enable|disable).
      properties:
        changed: { type: boolean }
        key: { type: string, minLength: 1 }
        enabled: { type: boolean }
    UserOverrideView:
      type: object
      required: [id, userId, userName, permissionId, permissionName, moduleKey, granted, grantedByName, grantedAt, expiresAt]
      description: View override per-user PER SET — satu baris core_user_permissions hidup (ddl/52).
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        permissionId: { type: integer }
        permissionName: { type: string }
        moduleKey:
          type: string
          description: Prefix nama permission sebelum titik pertama ("acc.jurnal.post" → "acc").
        granted: { type: boolean }
        grantedByName: { type: [string, 'null'] }
        grantedAt: { type: string }
        expiresAt:
          type: [string, 'null']
          description: Null = override permanen (tanpa kedaluwarsa).
    UserOverrideCreate:
      type: object
      required: [userId, permissionId, granted]
      description: 'Body POST /system/user-overrides — `granted=false` = deny eksplisit; `expiresAt` ISO 8601 offset, null/tidak dikirim = permanen.'
      properties:
        userId: { type: integer, minimum: 1 }
        permissionId: { type: integer, minimum: 1 }
        granted: { type: boolean }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: ISO 8601 offset — null/absen = permanen.

    # ------------------------------------------------------------ DATASCOPE
    ScopeDefinitionView:
      type: object
      required: [id, module_id, scope_key, label, description, target_table, target_field, operator, is_active, version, created_at]
      description: View definisi dimensi scope (core_scope_definitions + module_id) — field snake_case PERSIS zod. target_table/target_field = registry UI/validasi; evaluator tidak pernah menyusun SQL dari string DB.
      properties:
        id: { type: integer, minimum: 1 }
        module_id:
          type: integer
          minimum: 1
          description: Modul pemilik definisi (FK core_modules).
        scope_key:
          type: string
          minLength: 1
          maxLength: 50
          description: Kunci pendek kebab-case dipakai kode — mis. 'storages'.
        label: { type: string, minLength: 3, maxLength: 100 }
        description: { type: string, maxLength: 300 }
        target_table: { type: string, minLength: 1, maxLength: 100 }
        target_field: { type: string, minLength: 1, maxLength: 100 }
        operator:
          type: string
          enum: [in]
          description: Operator pembanding dimensi scope — v1 hanya whitelist 'in'.
        is_active: { type: boolean }
        version:
          type: integer
          minimum: 0
          description: Optimistic locking If-Match (PATCH definisi).
        created_at: { type: string, format: date-time }
    ScopeDefinitionSummary:
      type: object
      required: [id, module_id, scope_key, label, description, target_table, target_field, operator, is_active, version, created_at, assignmentCount]
      description: ScopeDefinitionView + assignmentCount (ringkasan katalog).
      allOf:
        - $ref: '#/components/schemas/ScopeDefinitionView'
        - type: object
          required: [assignmentCount]
          properties:
            assignmentCount: { type: integer, minimum: 0 }
    ScopeDefinitionCreate:
      type: object
      required: [scope_key, label, target_table, target_field]
      description: 'Body POST /system/datascope/definitions — scope_key kebab-case regex ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$ maks 50; label 3..100; target_table/target_field 1..100; description ≤300 opsional; module_id opsional (default modul system).'
      properties:
        module_id: { type: integer, minimum: 1 }
        scope_key: { type: string, pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$', maxLength: 50 }
        label: { type: string, minLength: 3, maxLength: 100 }
        description: { type: string, maxLength: 300 }
        target_table: { type: string, minLength: 1, maxLength: 100 }
        target_field: { type: string, minLength: 1, maxLength: 100 }
    ScopeDefinitionUpdate:
      type: object
      description: Body PATCH definisi — bentuk sama dengan create (semua opsional); scope_key baru divalidasi ulang unik (modul, key) di backend.
      properties:
        label: { type: string, minLength: 3, maxLength: 100 }
        scope_key: { type: string, maxLength: 50 }
        module_id: { type: integer, minimum: 1 }
        target_table: { type: string, maxLength: 100 }
        target_field: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 300 }
        is_active: { type: boolean }
    ScopeAssignmentView:
      type: object
      required: [id, definition_id, role_id, user_id, role_name, username, is_active, note, value_count, version, values]
      description: View pemberian scope (core_scope_assignments) + ringkasan role_name/username hasil JOIN; value_count = jumlah nilai whitelist.
      properties:
        id: { type: integer, minimum: 1 }
        definition_id: { type: integer, minimum: 1 }
        role_id:
          type: [integer, 'null']
          minimum: 1
          description: Tepat salah satu terisi (CHECK XOR DB) — null = subjek satunya.
        user_id: { type: [integer, 'null'], minimum: 1 }
        role_name: { type: [string, 'null'] }
        username: { type: [string, 'null'] }
        is_active: { type: boolean }
        note: { type: string, maxLength: 200 }
        value_count: { type: integer, minimum: 0 }
        version:
          type: integer
          minimum: 0
          description: Optimistic locking If-Match (PATCH assignment).
        values:
          type: array
          description: Whitelist nilai tersimpan — untuk seeding UI Kelola Nilai.
          items: { type: string }
    ScopeAssignmentCreate:
      type: object
      required: [definition_id]
      description: 'Body POST /system/datascope/assignments — pemberian ke role ATAU user; XOR: tepat satu role_id/user_id terisi (superRefine DS-SUBJECT-401); note ≤200 opsional.'
      properties:
        definition_id: { type: integer, minimum: 1 }
        role_id: { type: [integer, 'null'], minimum: 1 }
        user_id: { type: [integer, 'null'], minimum: 1 }
        note: { type: string, maxLength: 200 }
    ScopeAssignmentUpdate:
      type: object
      description: Body PATCH assignment — semua opsional (is_active/note ≤200).
      properties:
        is_active: { type: boolean }
        note: { type: string, maxLength: 200 }
    ScopeValuesSet:
      type: object
      required: [assignment_id, values]
      description: 'Body PUT /system/datascope/assignments/{id}/values — REPLACE himpunan nilai whitelist (bulk satu tx). `assignment_id` wajib sama dengan path; tiap nilai teks 1..50 karakter; maks 500 item.'
      properties:
        assignment_id: { type: integer, minimum: 1 }
        values:
          type: array
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 50 }
    ScopeOptionColumn:
      type: object
      required: [key, label]
      description: Metadata kolom tampilan opsi (hasil introspeksi struktur tabel rujukan).
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
    ScopeOptionRow:
      type: object
      description: Baris opsi nilai whitelist — DINAMIS mengikuti struktur tabel rujukan definisi; selalu ada `value` (PK, disimpan ke whitelist) + kolom tampilan sesuai `columns`.
      additionalProperties:
        type: [string, number, 'null']

    # ------------------------------------------------------------ RBAC/USERS
    RoleView:
      type: object
      required: [id, code, role, description, isSystem, createdAt, updatedAt]
      description: View role + jumlah member opsional (JOIN core_users_roles). Role sebagai data (code, role) — batas tier fitur bukan milik role.
      properties:
        id: { type: integer, minimum: 1 }
        code: { type: string, minLength: 1 }
        role:
          type: string
          minLength: 1
          description: Label tampilan (kolom DDL `role`).
        description: { type: [string, 'null'] }
        isSystem: { type: boolean }
        memberCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateRole:
      type: object
      required: [code, role]
      description: 'Body POST role — code 2..32 regex ^[a-z0-9_-]+$; role (label) ≥1; description ≤500 opsional.'
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[a-z0-9_-]+$'
          description: 'Kode role: huruf kecil, angka, dash/underscore.'
        role: { type: string, minLength: 1 }
        description: { type: string, maxLength: 500 }
    UpdateRole:
      type: object
      description: 'Body PATCH role — id diisi backend dari path (tidak perlu dikirim); role ≥1 opsional; description ≤500 nullable opsional.'
      properties:
        id: { type: integer, minimum: 1 }
        role: { type: string, minLength: 1 }
        description: { type: [string, 'null'], maxLength: 500 }
    ReplaceRolePermissions:
      type: object
      required: [permissionIds]
      description: Body PUT /system/roles/{id}/permissions — id SET (core_permissions) pengganti seluruh grant.
      properties:
        permissionIds:
          type: array
          items: { type: integer, minimum: 1 }
    UserView:
      type: object
      required: [id, username, name, email, roles, department, isActive, passwordChangedAt, mustChangePassword, failedLoginAttempts, lockedUntil, mfaEnabled, lastLoginAt, createdAt]
      description: View user TANPA password_hash — MULTI-ROLE (junction core_users_roles).
      properties:
        id: { type: integer, minimum: 1 }
        username: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        email: { type: string }
        roles:
          type: array
          description: Semua role dipegang user.
          items:
            type: object
            required: [code, role]
            properties:
              code: { type: string, minLength: 1 }
              role: { type: string, minLength: 1 }
        department: { type: string }
        isActive: { type: boolean }
        passwordChangedAt: { type: [string, 'null'], format: date-time }
        mustChangePassword: { type: boolean }
        failedLoginAttempts: { type: integer, minimum: 0 }
        lockedUntil: { type: [string, 'null'], format: date-time }
        mfaEnabled: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    UserRoleAssignment:
      type: object
      required: [userId, roleCode, assignedBy, assignedAt]
      description: View penugasan role (core_users_roles — UserRoleAssignment).
      properties:
        userId: { type: integer, minimum: 1 }
        roleCode: { type: string, minLength: 1 }
        assignedBy: { type: string, minLength: 1 }
        assignedAt: { type: string, format: date-time }
    UserDetail:
      type: object
      required: [user, extraRoles, effectivePermissions, rolePermissions, overrides, sessions, mfa]
      description: Detail lengkap satu user untuk Sheet Pengguna (UserDetail).
      properties:
        user: { $ref: '#/components/schemas/UserView' }
        extraRoles:
          type: array
          items: { $ref: '#/components/schemas/UserRoleAssignment' }
        effectivePermissions:
          type: array
          description: Permission code efektif hasil resolveEffective (union role + override).
          items: { type: string }
        rolePermissions:
          type: array
          description: Nama SET yang dipegang user via junction role.
          items: { type: string }
        overrides:
          type: array
          items: { $ref: '#/components/schemas/UserOverrideView' }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionRow' }
        mfa:
          type: [object, 'null']
          description: Status MFA user (null = belum terdaftar).
          allOf: [{ $ref: '#/components/schemas/UserMfa' }]
    CreateUser:
      type: object
      required: [username, fullName, department, roleIds]
      description: 'Body POST user — multi-role via roleIds (min 1); password dibuat backend; isActive default true. username 3..64 regex ^[a-z0-9_.-]+$; email opsional; fullName/department ≥1.'
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-z0-9_.-]+$'
          description: 'Username: huruf kecil, angka, titik, underscore, dash.'
        email: { type: string, format: email }
        fullName: { type: string, minLength: 1 }
        department: { type: string, minLength: 1 }
        roleIds:
          type: array
          minItems: 1
          description: Role yang dipegang (urutan tidak menentukan hierarki).
          items: { type: integer, minimum: 1 }
        isActive: { type: boolean, default: true }
    SetUserActiveBody:
      type: object
      required: [isActive]
      description: Body PATCH /system/users/{id}/active.
      properties:
        isActive: { type: boolean }
    ResetPasswordBody:
      type: object
      description: 'Body POST /system/users/{id}/password-reset — kosong = backend men-generate; bila dikirim min 8 karakter.'
      properties:
        temporaryPassword: { type: string, minLength: 8 }
    PasswordResetResult:
      type: object
      required: [temporaryPassword]
      description: Respons POST /system/users/{id}/password-reset — password sementara tampil SEKALI.
      properties:
        temporaryPassword: { type: string, minLength: 8 }
    AssignUserRoles:
      type: object
      required: [roleIds]
      description: Body PUT /system/users/{id}/roles — REPLACE semua role user (minimal satu).
      properties:
        roleIds:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1 }
    OverviewStats:
      type: object
      required: [totalUsers, activeUsers, lockedUsers, mfaUsers, activeSessions, failedLogins24h, roles, auditToday, routes, permissions]
      description: Statistik halaman Overview modul System + hitungan registry IAM v2 (routes & permissions).
      properties:
        totalUsers: { type: integer, minimum: 0 }
        activeUsers: { type: integer, minimum: 0 }
        lockedUsers: { type: integer, minimum: 0 }
        mfaUsers: { type: integer, minimum: 0 }
        activeSessions: { type: integer, minimum: 0 }
        failedLogins24h: { type: integer, minimum: 0 }
        roles: { type: integer, minimum: 0 }
        auditToday: { type: integer, minimum: 0 }
        routes: { type: integer, minimum: 0 }
        permissions: { type: integer, minimum: 0 }

    # ------------------------------------------------------------ SESSIONS
    SessionRow:
      type: object
      required: [id, userId, userName, deviceKey, loginAt, expiresAt, logoutAt, revokedAt, ipAddress, userAgent, device, isValid]
      description: View sesi (core_sessions — UserSession). Identitas waktu = loginAt (kolom DDL login_at).
      properties:
        id: { type: integer, minimum: 1 }
        userId: { type: integer, minimum: 1 }
        userName: { type: string, minLength: 1 }
        deviceKey: { type: [string, 'null'] }
        loginAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        logoutAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        ipAddress: { type: string, minLength: 1 }
        userAgent: { type: string, minLength: 1 }
        device: { type: string, minLength: 1 }
        isValid: { type: boolean }

    # ------------------------------------------------------------ SECURITY
    LoginAuditEntry:
      type: object
      required: [id, userId, usernameTried, success, failReason, ipAddress, userAgent, attemptedAt]
      description: View jejak percobaan login (core_login_audit — LoginAuditEntry).
      properties:
        id: { type: integer, minimum: 1 }
        userId: { type: [integer, 'null'], minimum: 1 }
        usernameTried: { type: string, minLength: 1 }
        success: { type: boolean }
        failReason:
          description: Null bila sukses.
          type: [string, 'null']
          enum: [unknown_user, wrong_password, locked, inactive, mfa_failed, null]
        ipAddress: { type: string, minLength: 1 }
        userAgent: { type: string, minLength: 1 }
        attemptedAt: { type: string, format: date-time }
    UserMfa:
      type: object
      required: [userId, userName, method, confirmedAt, enabled, lastUsedAt, recoveryCodesLeft]
      description: View MFA 1:1 user (core_user_mfa — UserMfa).
      properties:
        userId: { type: integer, minimum: 1 }
        userName: { type: string, minLength: 1 }
        method: { $ref: '#/components/schemas/MfaMethod' }
        confirmedAt: { type: [string, 'null'], format: date-time }
        enabled: { type: boolean }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        recoveryCodesLeft: { type: integer, minimum: 0 }
    UserMfaStatus:
      type: object
      required: [userId, userName, username, mfa]
      description: 'Baris status MFA per pengguna (LEFT JOIN core_users × core_user_mfa) — pengguna TANPA baris MFA tetap tampil (`mfa: null`).'
      properties:
        userId: { type: integer, minimum: 1 }
        userName: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        mfa:
          type: [object, 'null']
          description: Null = "belum daftar".
          allOf: [{ $ref: '#/components/schemas/UserMfa' }]
    SetMfaBody:
      type: object
      required: [userId, enabled]
      description: Body POST /system/security/mfa — aktif/nonaktifkan MFA user.
      properties:
        userId: { type: integer, minimum: 1 }
        enabled: { type: boolean }
    PasswordHistoryEntry:
      type: object
      required: [id, userId, userName, setAt, maskedHash]
      description: View riwayat password (core_password_history — hash dimasker).
      properties:
        id: { type: integer, minimum: 1 }
        userId: { type: integer, minimum: 1 }
        userName: { type: string, minLength: 1 }
        setAt: { type: string, format: date-time }
        maskedHash: { type: string, minLength: 1 }
    IpAllowlistRule:
      type: object
      required: [id, roleCode, userId, target, cidr, note, createdAt]
      description: View aturan allowlist IP (core_ip_allowlist — target berelasi role/user).
      properties:
        id: { type: integer, minimum: 1 }
        roleCode: { type: [string, 'null'] }
        userId: { type: [integer, 'null'], minimum: 1 }
        target: { type: string, minLength: 1 }
        cidr: { type: string, minLength: 1 }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    IpAllowlistCreate:
      type: object
      description: 'Body POST aturan allowlist — minimal satu target (roleCode ATAU userId; refine zod = CHECK DDL target_required). cidr regex IPv4 CIDR ^\d{1,3}(\.\d{1,3}){3}(/(3[0-2]|[12]?\d))?$; note ≤200 nullable.'
      properties:
        roleCode: { type: [string, 'null'], minLength: 1 }
        userId: { type: [integer, 'null'], minimum: 1 }
        cidr:
          type: string
          pattern: '^\d{1,3}(\.\d{1,3}){3}(/(3[0-2]|[12]?\d))?$'
          description: 'Format CIDR IPv4, mis. 10.10.4.0/24.'
        note: { type: [string, 'null'], maxLength: 200 }

    # ------------------------------------------------------------ AUDIT
    AuditTrailEntry:
      type: object
      required: [id, at, actorUserId, actorName, moduleKey, entityType, entityId, action, beforeValue, afterValue, severity, ipAddress, userAgent, requestId]
      description: View audit trail pusat (core_audit_trail — append-only).
      properties:
        id: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        actorUserId: { type: [integer, 'null'], minimum: 1 }
        actorName: { type: string, minLength: 1 }
        moduleKey:
          type: [string, 'null']
          description: Modul sumber aksi — null = platform.
          enum: [inventory, accounting, sales, finance, hr, crm, whatsapp-crm, book, pos, purchasing, asset, ess, fnb, system, payment-gateway, shipment, ecom, wf, ai-llm, null]
        entityType: { type: string, minLength: 1 }
        entityId: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
        beforeValue:
          type: [object, 'null']
          description: Snapshot jsonb sebelum (record object).
          additionalProperties: true
        afterValue:
          type: [object, 'null']
          description: Snapshot jsonb sesudah (record object).
          additionalProperties: true
        severity: { $ref: '#/components/schemas/AuditSeverity' }
        ipAddress: { type: string, minLength: 1 }
        userAgent: { type: string, minLength: 1 }
        requestId: { type: string, minLength: 1 }

    # ------------------------------------------------------------ ENVIRONMENT
    EnvFieldOption:
      type: object
      required: [value, label]
      description: Opsi field bertipe select.
      properties:
        value: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
    EnvField:
      type: object
      required: [key, label, value, fieldType]
      description: Satu field konfigurasi (payload jsonb core_app_settings.fields — EnvField).
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        value:
          type: [string, boolean]
          description: Nilai field — string atau boolean (switch).
        fieldType: { $ref: '#/components/schemas/EnvFieldType' }
        description: { type: string }
        placeholder: { type: string }
        hint: { type: string }
        options:
          type: array
          description: Wajib bila fieldType select.
          items: { $ref: '#/components/schemas/EnvFieldOption' }
    EnvCategoryData:
      type: object
      required: [category, fields]
      description: Data satu kategori environment (baris core_app_settings — EnvCategoryData).
      properties:
        category: { $ref: '#/components/schemas/EnvCategory' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/EnvField' }
    CompanyLogo:
      type: object
      required: [logoName, logoDataUrl]
      description: Logo perusahaan (core_meta id="company_logo") — juga body POST /system/environment/logo.
      properties:
        logoName: { type: string }
        logoDataUrl:
          type: [string, 'null']
          description: Data URL gambar (null = hapus logo).
    EnvironmentConfig:
      type: object
      required: [categories, logo]
      description: Konfigurasi environment utuh untuk halaman Pengaturan (fetchEnvironment).
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/EnvCategoryData' }
        logo: { $ref: '#/components/schemas/CompanyLogo' }
    SaveEnvironmentCategory:
      type: object
      required: [category, values]
      description: Body POST /system/environment — simpan perubahan satu kategori (key → nilai baru string|boolean).
      properties:
        category: { $ref: '#/components/schemas/EnvCategory' }
        values:
          type: object
          additionalProperties:
            type: [string, boolean]
    SmtpTestResult:
      type: object
      required: [ok, message]
      description: Hasil uji kirim email SMTP (testSmtp) — ok false tetap 200.
      properties:
        ok: { type: boolean }
        message: { type: string, minLength: 1 }

    # ------------------------------------------------------------ TENANTS
    TenantView:
      type: object
      required: [id, entityId, kode, nama, paketTier, status, maxUsers, maxLokasi, kontakEmail, kontakTelepon, versiSkema, version, createdAt, updatedAt, deletedAt]
      description: View tenant (core_tenants) — entityId uuid entitas registry, waktu ISO 8601.
      properties:
        id: { type: integer, minimum: 1 }
        entityId: { type: string, format: uuid }
        kode: { type: string, minLength: 1 }
        nama: { type: string, minLength: 1 }
        paketTier: { $ref: '#/components/schemas/PaketTier' }
        status: { $ref: '#/components/schemas/StatusTenant' }
        maxUsers: { type: [integer, 'null'], minimum: 0 }
        maxLokasi: { type: [integer, 'null'], minimum: 0 }
        kontakEmail: { type: [string, 'null'] }
        kontakTelepon: { type: [string, 'null'] }
        versiSkema:
          type: integer
          description: Versi skema DB tenant (migrasi berjalan — default 1).
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
    TenantCreate:
      type: object
      required: [kode, nama, paketTier]
      description: 'Body POST tenant — kode trim 3..50 regex ^[a-z0-9][a-z0-9._-]*$ (lowercase unik via API); nama trim 2..100; paketTier default PS2; kuota/kontak opsional nullable.'
      properties:
        kode:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-z0-9][a-z0-9._-]*$'
          description: 'Kode tenant hanya huruf kecil, angka, titik, garis — tanpa spasi.'
        nama: { type: string, minLength: 2, maxLength: 100 }
        paketTier:
          allOf: [{ $ref: '#/components/schemas/PaketTier' }]
          default: PS2
        maxUsers:
          type: [integer, 'null']
          minimum: 0
          description: Kuota pemakaian (null = ikut batas tier).
        maxLokasi: { type: [integer, 'null'], minimum: 0 }
        kontakEmail:
          type: [string, 'null']
          format: email
          maxLength: 150
        kontakTelepon: { type: [string, 'null'], maxLength: 50 }
    TenantUpdate:
      type: object
      required: [version]
      description: 'Body PATCH tenant — tenantCreateSchema.partial() tanpa default + `version` int ≥1 WAJIB (If-Match → 412); paketTier opsional tanpa default.'
      properties:
        kode: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-z0-9][a-z0-9._-]*$' }
        nama: { type: string, minLength: 2, maxLength: 100 }
        paketTier: { $ref: '#/components/schemas/PaketTier' }
        maxUsers: { type: [integer, 'null'], minimum: 0 }
        maxLokasi: { type: [integer, 'null'], minimum: 0 }
        kontakEmail: { type: [string, 'null'], format: email, maxLength: 150 }
        kontakTelepon: { type: [string, 'null'], maxLength: 50 }
        version:
          type: integer
          minimum: 1
          description: Optimistic locking — wajib (fallback header If-Match).
    TenantAction:
      type: object
      description: 'Body aksi siklus hidup tenant (suspend/reactivate/close) — `alasan` opsional ≤300 untuk audit/payload event.'
      properties:
        alasan: { type: [string, 'null'], maxLength: 300 }
    TenantTierSet:
      type: object
      required: [paketTier]
      description: 'Body PUT /system/tenants/{id}/tier — `paketTier` wajib; `version` opsional (dipakai bila header If-Match tidak dikirim).'
      properties:
        paketTier: { $ref: '#/components/schemas/PaketTier' }
        version: { type: integer, minimum: 1 }
    TenantMembersAdd:
      type: object
      required: [idCoreUsers, isDefault]
      description: 'Body POST /system/tenants/{id}/members — `isDefault` menjadikan tenant ini default user (default lain dikosongkan).'
      properties:
        idCoreUsers: { type: integer, minimum: 1 }
        isDefault: { type: boolean, default: false }
    TenantSettingsSet:
      type: object
      required: [kategori, entri]
      description: 'Body PUT settings — REPLACE satu kategori (hapus entri kategori, sisip payload); kategori 1..100; entri 1..100 item; kunci 1..100; nilai jsonb bebas; kunci duplikat: nilai terakhir menang.'
      properties:
        kategori: { type: string, minLength: 1, maxLength: 100 }
        entri:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [kunci, nilai]
            properties:
              kunci: { type: string, minLength: 1, maxLength: 100 }
              nilai:
                description: Nilai jsonb bebas (z.unknown).
    TenantModuleSet:
      type: object
      required: [idModules]
      description: Body PUT /system/tenants/{id}/modules — REPLACE set modul aktif (maks 200).
      properties:
        idModules:
          type: array
          maxItems: 200
          items: { type: integer, minimum: 1 }
    TenantFeatureSet:
      type: object
      required: [idFeatures]
      description: Body PUT /system/tenants/{id}/features — REPLACE set fitur aktif (maks 500).
      properties:
        idFeatures:
          type: array
          maxItems: 500
          items: { type: integer, minimum: 1 }
    TenantContextRow:
      type: object
      required: [idTenant, kode, nama, status, isDefault]
      description: Baris konteks tenant user saat ini (GET /system/tenants/context).
      properties:
        idTenant: { type: integer, minimum: 1 }
        kode: { type: string, minLength: 1 }
        nama: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/StatusTenant' }
        isDefault: { type: boolean }
    TenantModuleRow:
      type: object
      required: [id, key, nama, aktif]
      description: Baris katalog modul tenant (GET/PUT modules).
      properties:
        id: { type: integer, minimum: 1 }
        key: { type: string, minLength: 1 }
        nama: { type: string }
        aktif: { type: boolean }
    TenantFeatureRow:
      type: object
      required: [id, moduleKey, key, nama, aktif]
      description: Baris katalog fitur tenant (GET/PUT features).
      properties:
        id: { type: integer, minimum: 1 }
        moduleKey: { type: string, minLength: 1 }
        key: { type: string, minLength: 1 }
        nama: { type: string }
        aktif: { type: boolean }
    TenantSettingRow:
      type: object
      required: [kategori, kunci, nilai]
      description: Baris setting tenant (GET/PUT settings) — nilai jsonb bebas.
      properties:
        kategori: { type: string, minLength: 1 }
        kunci: { type: string, minLength: 1 }
        nilai:
          description: Nilai jsonb bebas (z.unknown).
    TenantEventView:
      type: object
      required: [id, aksi, payload, aktor, createdAt]
      description: View event tenant (riwayat aksi perubahan tenant — append-only untuk audit).
      properties:
        id: { type: integer, minimum: 1 }
        aksi:
          type: string
          minLength: 1
          description: PROVISI/SUSPEND/REAKTIVASI/TUTUP/SET_TIER/SET_MODUL/SET_FITUR/SET_ANGGOTA/SET_PENGATURAN.
        payload:
          description: Payload event (jsonb bebas).
        aktor: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    TenantMemberView:
      type: object
      required: [idCoreUsers, username, nama, isDefault, dicabutPada]
      description: View anggota tenant (core_users_tenants JOIN core_users) — dicabutPada non-null = akses dicabut.
      properties:
        idCoreUsers: { type: integer, minimum: 1 }
        username: { type: string, minLength: 1 }
        nama: { type: string, minLength: 1 }
        isDefault: { type: boolean }
        dicabutPada: { type: [string, 'null'], format: date-time }

    # ------------------------------------------------------------ FILES
    FileView:
      type: object
      required: [id, fileId, fileName, mimeType, kind, sizeBytes, scope, checksumSha256, uploadedBy, idCoreModules, idKategori, createdAt, updatedAt]
      description: View satu file terdaftar (baris core_files — hasil upload & daftar). id = id publik (string); fileId = numerik.
      properties:
        id: { type: string }
        fileId: { type: number }
        fileName: { type: string }
        mimeType: { type: string }
        kind: { $ref: '#/components/schemas/FileKind' }
        sizeBytes: { type: number }
        scope: { type: string }
        checksumSha256: { type: [string, 'null'] }
        uploadedBy: { type: [string, 'null'] }
        idCoreModules:
          type: [number, 'null']
          description: Modul pemilik (ddl/44) — null = general.
        idKategori:
          type: [number, 'null']
          description: Kategori library — null = "Tanpa kategori".
        createdAt: { type: string }
        updatedAt: { type: string }
    FileUpload:
      type: object
      required: [scope, fileName, mimeType, dataBase64]
      description: 'Body unggah — file dikirim base64 JSON (tanpa multipart; cap 8 MB server). scope 1..48; fileName 1..200; mimeType 3..120; idCoreModules/idKategori opsional (null = tanpa).'
      properties:
        scope: { type: string, minLength: 1, maxLength: 48 }
        fileName: { type: string, minLength: 1, maxLength: 200 }
        mimeType: { type: string, minLength: 3, maxLength: 120 }
        dataBase64:
          type: string
          minLength: 1
          description: Isi file base64 (payload JSON, bukan multipart).
        idCoreModules: { type: [integer, 'null'], minimum: 1 }
        idKategori: { type: [integer, 'null'], minimum: 1 }
    MediaKategoriView:
      type: object
      required: [id, idCoreModules, nama, keterangan, jumlahFile, version, createdAt, updatedAt]
      description: View satu kategori (baris core_media_categories — soft delete aware).
      properties:
        id: { type: number }
        idCoreModules: { type: [number, 'null'] }
        nama: { type: string }
        keterangan: { type: [string, 'null'] }
        jumlahFile:
          type: integer
          description: Jumlah file hidup dalam kategori (hitung server — badge FE).
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    MediaKategoriCreate:
      type: object
      required: [nama]
      description: 'Body tambah kategori — nama trim 1..100; keterangan trim ≤200 nullable; idCoreModules null = kategori bersama.'
      properties:
        nama: { type: string, minLength: 1, maxLength: 100 }
        keterangan: { type: [string, 'null'], maxLength: 200 }
        idCoreModules: { type: [integer, 'null'], minimum: 1 }
    MediaKategoriUpdate:
      type: object
      required: [version]
      description: 'Body ubah kategori — `version` (min 1) wajib; wajib minimal satu field lain ikut dikirim (refine zod); keterangan/idCoreModules nullable.'
      properties:
        nama: { type: string, minLength: 1, maxLength: 100 }
        keterangan: { type: [string, 'null'], maxLength: 200 }
        idCoreModules: { type: [integer, 'null'], minimum: 1 }
        version:
          type: integer
          minimum: 1
          description: Optimistic lock — 409 VERSI_BENTROK bila stale.
    SignedUrl:
      type: object
      required: [id, fileId, kind, url, expiresIn]
      description: Presigned URL GET (1 jam) — hasil GET /system/files/{id}/url.
      properties:
        id: { type: string }
        fileId: { type: number }
        kind: { $ref: '#/components/schemas/FileKind' }
        url: { type: string }
        expiresIn: { type: number }

    # ------------------------------------------------------------ WILAYAH
    WilayahProvinsiView:
      type: object
      required: [id, kode, nama, version]
      description: View provinsi (core_provinsi) — kode Kemendagri 2 digit.
      properties:
        id: { type: integer }
        kode: { type: string }
        nama: { type: string }
        version:
          type: integer
          description: Optimistic locking mutasi admin (STD-07).
    WilayahKotaView:
      type: object
      required: [id, kode, nama, jenis, idCoreProvinsi, provinsiNama, version]
      description: View kota/kabupaten (core_kota) — kode 4 digit.
      properties:
        id: { type: integer }
        kode: { type: string }
        nama: { type: string }
        jenis: { $ref: '#/components/schemas/JenisKota' }
        idCoreProvinsi: { type: integer }
        provinsiNama: { type: string }
        version: { type: integer }
    WilayahKecamatanView:
      type: object
      required: [id, kode, nama, idCoreKota, kotaNama, version]
      description: View kecamatan (core_kecamatan) — kode 6 digit.
      properties:
        id: { type: integer }
        kode: { type: string }
        nama: { type: string }
        idCoreKota: { type: integer }
        kotaNama: { type: string }
        version: { type: integer }
    WilayahKelurahanView:
      type: object
      required: [id, kode, nama, kodePos, idCoreKecamatan, kecamatanNama, version]
      description: View kelurahan/desa (core_kelurahan) — kode 10 digit; kodePos 5 digit.
      properties:
        id: { type: integer }
        kode: { type: string }
        nama: { type: string }
        kodePos:
          type: [string, 'null']
          description: '5 digit; NULL = belum tercantum di sumber resmi (±0,29% desa pemekaran).'
        idCoreKecamatan: { type: integer }
        kecamatanNama: { type: string }
        version: { type: integer }
    WilayahKelurahanLengkapView:
      type: object
      required: [id, kode, nama, kodePos, idCoreKecamatan, kecamatanNama, version, kodeKecamatan, kodeKota, kodeProvinsi, kotaNama, provinsiNama]
      description: Rantai lengkap satu kelurahan — bahan alamat member & payload ongkir SHP (M55).
      allOf:
        - $ref: '#/components/schemas/WilayahKelurahanView'
        - type: object
          required: [kodeKecamatan, kodeKota, kodeProvinsi, kotaNama, provinsiNama]
          properties:
            kodeKecamatan: { type: string }
            kodeKota: { type: string }
            kodeProvinsi: { type: string }
            kotaNama: { type: string }
            provinsiNama: { type: string }
    WilayahProvinsiBuat:
      type: object
      required: [kode, nama]
      description: 'Buat provinsi — kode trim regex ^\d{2}$ (2 digit, leading zero terjaga); nama 1..100.'
      properties:
        kode: { type: string, pattern: '^\d{2}$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
    WilayahProvinsiUbah:
      type: object
      required: [version]
      description: 'Ubah provinsi (PATCH) — semua field opsional KECALI `version` (min 1, wajib — optimistic locking).'
      allOf:
        - $ref: '#/components/schemas/WilayahProvinsiBuat'
        - type: object
          properties:
            kode: { type: string, pattern: '^\d{2}$' }
            nama: { type: string, minLength: 1, maxLength: 100 }
            version:
              type: integer
              minimum: 1
    WilayahProvinsiHapus:
      type: object
      required: [version]
      description: 'Hapus lunak provinsi (DELETE) — body cukup `version` (min 1).'
      properties:
        version: { type: integer, minimum: 1 }
    WilayahKotaBuat:
      type: object
      required: [kode, nama, jenis, idCoreProvinsi]
      description: 'Buat kota/kabupaten — kode trim regex ^\d{4}$ (2 prov + 2 kab); jenis cermin CHECK ddl/42; idCoreProvinsi ≥1.'
      properties:
        kode: { type: string, pattern: '^\d{4}$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
        jenis: { $ref: '#/components/schemas/JenisKota' }
        idCoreProvinsi: { type: integer, minimum: 1 }
    WilayahKotaUbah:
      type: object
      required: [version]
      description: 'Ubah kota (PATCH) — semua opsional KECALI `version` (wajib, min 1).'
      allOf:
        - $ref: '#/components/schemas/WilayahKotaBuat'
        - type: object
          properties:
            kode: { type: string, pattern: '^\d{4}$' }
            nama: { type: string, minLength: 1, maxLength: 100 }
            idCoreProvinsi: { type: integer, minimum: 1 }
            version: { type: integer, minimum: 1 }
    WilayahKotaHapus:
      type: object
      required: [version]
      description: 'Hapus lunak kota — body `version` wajib (min 1).'
      properties:
        version: { type: integer, minimum: 1 }
    WilayahKecamatanBuat:
      type: object
      required: [kode, nama, idCoreKota]
      description: 'Buat kecamatan — kode trim regex ^\d{6}$ (4 kota + 2 kec); idCoreKota ≥1.'
      properties:
        kode: { type: string, pattern: '^\d{6}$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
        idCoreKota: { type: integer, minimum: 1 }
    WilayahKecamatanUbah:
      type: object
      required: [version]
      description: 'Ubah kecamatan (PATCH) — semua opsional KECALI `version` (wajib, min 1).'
      allOf:
        - $ref: '#/components/schemas/WilayahKecamatanBuat'
        - type: object
          properties:
            kode: { type: string, pattern: '^\d{6}$' }
            nama: { type: string, minLength: 1, maxLength: 100 }
            idCoreKota: { type: integer, minimum: 1 }
            version: { type: integer, minimum: 1 }
    WilayahKecamatanHapus:
      type: object
      required: [version]
      description: 'Hapus lunak kecamatan — body `version` wajib (min 1).'
      properties:
        version: { type: integer, minimum: 1 }
    WilayahKelurahanBuat:
      type: object
      required: [kode, nama, idCoreKecamatan]
      description: 'Buat kelurahan/desa — kode trim regex ^\d{10}$; kodePos opsional regex ^\d{5}$ (null = belum tercantum; "" dianggap tidak dikirim); idCoreKecamatan ≥1.'
      properties:
        kode: { type: string, pattern: '^\d{10}$' }
        nama: { type: string, minLength: 1, maxLength: 100 }
        kodePos:
          type: [string, 'null']
          pattern: '^\d{5}$'
          description: Kode pos 5 digit — null = belum tercantum.
        idCoreKecamatan: { type: integer, minimum: 1 }
    WilayahKelurahanUbah:
      type: object
      required: [version]
      description: 'Ubah kelurahan (PATCH) — semua opsional KECALI `version`; `kodePos: null` = hapus kode pos (""/absen = tidak berubah).'
      allOf:
        - $ref: '#/components/schemas/WilayahKelurahanBuat'
        - type: object
          properties:
            kode: { type: string, pattern: '^\d{10}$' }
            nama: { type: string, minLength: 1, maxLength: 100 }
            kodePos: { type: [string, 'null'], pattern: '^\d{5}$' }
            idCoreKecamatan: { type: integer, minimum: 1 }
            version: { type: integer, minimum: 1 }
    WilayahKelurahanHapus:
      type: object
      required: [version]
      description: 'Hapus lunak kelurahan (level daun) — body `version` wajib (min 1).'
      properties:
        version: { type: integer, minimum: 1 }

    # ------------------------------------------------------------ CLUSTER
    ClusterView:
      type: object
      required: [id, entityId, code, nama, deskripsi, icon, tone, urutan, status, version, createdAt, updatedAt, jumlahModul]
      description: View cluster (list & dasar detail) — master pola core_tenants (entity_id Tier A, version optimistic locking, soft delete).
      properties:
        id: { type: number }
        entityId: { type: string, format: uuid }
        code: { type: string }
        nama: { type: string }
        deskripsi: { type: [string, 'null'] }
        icon: { type: [string, 'null'] }
        tone: { type: [string, 'null'] }
        urutan: { type: number }
        status: { $ref: '#/components/schemas/StatusAktif' }
        version: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        jumlahModul:
          type: integer
          minimum: 0
          description: Jumlah assignment modul hidup (deleted_at IS NULL) — dihitung backend.
    ClusterCreate:
      type: object
      required: [code, nama, urutan, status]
      description: 'Buat cluster — code trim 1..50; nama trim 1..100; deskripsi ≤200 nullable; icon ≤50; tone ≤100; urutan int ≥0 default 0; status default AKTIF.'
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        nama: { type: string, minLength: 1, maxLength: 100 }
        deskripsi: { type: [string, 'null'], maxLength: 200 }
        icon: { type: [string, 'null'], maxLength: 50 }
        tone: { type: [string, 'null'], maxLength: 100 }
        urutan: { type: integer, minimum: 0, default: 0 }
        status:
          allOf: [{ $ref: '#/components/schemas/StatusAktif' }]
          default: AKTIF
    ClusterUpdate:
      type: object
      required: [version]
      description: 'Update cluster (PATCH) — parsial + `version` int ≥0 WAJIB (optimistic locking If-Match — 409/412 bila bentrok).'
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        nama: { type: string, minLength: 1, maxLength: 100 }
        deskripsi: { type: [string, 'null'], maxLength: 200 }
        icon: { type: [string, 'null'], maxLength: 50 }
        tone: { type: [string, 'null'], maxLength: 100 }
        urutan: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/StatusAktif' }
        version: { type: integer, minimum: 0 }
    ClusterModulView:
      type: object
      required: [id, idCoreModules, key, name, tagline, enabled, fiturIds]
      description: Item modul dalam detail cluster — 1 baris core_cluster_modules hidup.
      properties:
        id:
          type: number
          description: id baris core_cluster_modules.
        idCoreModules: { type: number }
        key: { $ref: '#/components/schemas/ModuleKey' }
        name: { type: string }
        tagline: { type: string }
        enabled: { type: boolean }
        fiturIds:
          type: array
          items: { type: integer }
    ClusterDetail:
      type: object
      required: [id, entityId, code, nama, deskripsi, icon, tone, urutan, status, version, createdAt, updatedAt, jumlahModul, modul]
      description: Detail cluster = view + daftar modul ter-assign (beserta fiturnya).
      allOf:
        - $ref: '#/components/schemas/ClusterView'
        - type: object
          required: [modul]
          properties:
            modul:
              type: array
              items: { $ref: '#/components/schemas/ClusterModulView' }
    ClusterFeatureOption:
      type: object
      required: [id, featuresFolder, description]
      description: Katalog fitur satu modul (untuk UI assign cluster).
      properties:
        id: { type: number }
        featuresFolder: { type: string }
        description:
          description: Deskripsi fitur (jsonb bebas — z.unknown().nullish()).
    ClusterModulOption:
      type: object
      required: [id, key, name, tagline, enabled, fitur]
      description: Opsi modul untuk UI assign — katalog modul + status + katalog fitur per modul.
      properties:
        id: { type: number }
        key: { $ref: '#/components/schemas/ModuleKey' }
        name: { type: string }
        tagline: { type: string }
        enabled: { type: boolean }
        fitur:
          type: array
          items: { $ref: '#/components/schemas/ClusterFeatureOption' }
    ClusterModulSync:
      type: object
      required: [modulIds]
      description: Sinkronisasi modul cluster — set penuh id core_modules (replace assignment hidup).
      properties:
        modulIds:
          type: array
          items: { type: integer, minimum: 1 }
    ClusterFiturSync:
      type: object
      required: [fiturIds]
      description: Sinkronisasi fitur satu cluster-modul — set penuh id core_modules_features.
      properties:
        fiturIds:
          type: array
          items: { type: integer, minimum: 1 }

    # ------------------------------------------------------------ AGAMA
    AgamaView:
      type: object
      required: [id, entityId, code, nama, urutan, status, version, createdAt, updatedAt]
      description: View agama (list & pilihan dropdown) — master kosakata agama resmi (core_agama, ddl/72).
      properties:
        id: { type: number }
        entityId: { type: string, format: uuid }
        code:
          type: string
          description: Kosakata seed — ISLAM/KRISTEN_PROTESTAN/KRISTEN_KATOLIK/HINDU/BUDDHA/KHONGHUCU/KEPERCAYAAN (DB varchar bebas).
        nama: { type: string }
        urutan: { type: number }
        status: { $ref: '#/components/schemas/StatusAktif' }
        version: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgamaCreate:
      type: object
      required: [code, nama, urutan, status]
      description: 'Buat agama — code trim 1..50 (UPPERCASE-disarankan, unik hidup); nama trim 1..100; urutan int ≥0 default 0; status default AKTIF.'
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        nama: { type: string, minLength: 1, maxLength: 100 }
        urutan: { type: integer, minimum: 0, default: 0 }
        status:
          allOf: [{ $ref: '#/components/schemas/StatusAktif' }]
          default: AKTIF
    AgamaUpdate:
      type: object
      required: [version]
      description: 'Update agama (PATCH) — parsial + `version` int ≥0 WAJIB (optimistic locking If-Match — 409 bila bentrok).'
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        nama: { type: string, minLength: 1, maxLength: 100 }
        urutan: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/StatusAktif' }
        version: { type: integer, minimum: 0 }
