  # ==========================================================================
  # FILES (system.files.*) — 9 endpoint
  # ==========================================================================
  /system/files:
    get:
      operationId: listFiles
      tags: [files]
      summary: Daftar file hidup (paging).
      description: 'Permission: system.files.list. Soft-deleted tak pernah tampil — terbaru dulu. `idKategori: 0` = khusus file TANPA kategori (sentinel null).'
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, maxLength: 48 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: idCoreModules
          in: query
          required: false
          description: Filter modul pemilik (id numerik).
          schema: { type: integer, minimum: 1 }
        - name: idKategori
          in: query
          required: false
          description: Filter kategori library; 0 = tanpa kategori.
          schema: { type: integer, minimum: 0 }
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          description: Ukuran halaman (1..200, default 50).
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Page file hidup.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FileView' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      operationId: uploadFile
      tags: [files]
      summary: Unggah file (base64 JSON).
      description: 'Permission: system.files.upload. Tanpa multipart — `dataBase64` wajib; cap 8 MB ditegakkan server. Rule zod: scope 1..48, fileName 1..200, mimeType 3..120. idCoreModules/idKategori opsional — wajib valid bila diisi (404 SYS-404 bila absen).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileUpload' }
      responses:
        '201':
          description: File tersimpan & terdaftar.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FileView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /system/files/kategori:
    get:
      operationId: listMediaKategori
      tags: [files]
      summary: Daftar kategori hidup + jumlah file.
      description: 'Permission: system.files.listkategori. Kategori hidup (deleted_at IS NULL) — jumlahFile dihitung server (badge FE).'
      parameters:
        - name: idCoreModules
          in: query
          required: false
          description: Filter kategori milik modul.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Daftar kategori.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MediaKategoriView' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      operationId: createMediaKategori
      tags: [files]
      summary: Tambah kategori.
      description: 'Permission: system.files.createkategori. Rule zod: nama 1..100, keterangan ≤200, idCoreModules opsional (null = kategori bersama). 409 NAMA_DIPAKAI bila nama dipakai dalam lingkup modul sama.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaKategoriCreate' }
      responses:
        '201':
          description: Kategori dibuat (version awal 1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaKategoriView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
  /system/files/kategori/{id}:
    patch:
      operationId: updateMediaKategori
      tags: [files]
      summary: Ubah kategori.
      description: 'Permission: system.files.updatekategori. Optimistic lock `version` (wajib, min 1) — 409 VERSI_BENTROK bila stale; wajib menyertakan minimal satu perubahan selain version; 409 NAMA_DIPAKAI bila nama duplikat.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaKategoriUpdate' }
      responses:
        '200':
          description: Kategori terubah — version +1.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaKategoriView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
    delete:
      operationId: deleteMediaKategori
      tags: [files]
      summary: Hapus kategori (soft).
      description: 'Permission: system.files.removekategori. File terkait jadi "Tanpa kategori" (SET NULL) — aset aman.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Kategori soft-deleted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OkData' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /system/files/{id}:
    delete:
      operationId: deleteFile
      tags: [files]
      summary: SOFT delete file.
      description: 'Permission: system.files.remove. deleted_at=now(), version+1 dalam tx + audit. Object object-storage tidak disentuh (sweep terpisah).'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: File soft-deleted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OkData' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /system/files/{id}/raw:
    get:
      operationId: streamFileRaw
      tags: [files]
      summary: Stream isi file (same-origin, inline).
      description: 'Permission: system.files.streamraw. StreamableFile dengan Content-Type asli + Content-Disposition inline — preview `<img>/<video>/<iframe>` FE tanpa presign. OTORISASI COOKIE: klien memuat via cookie sesi httpOnly `nexierp_at` (bukan header Authorization) — jangan ubah mode cookie sesi untuk endpoint ini. 404 bila soft-deleted.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Stream isi file (Content-Type dari object storage).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /system/files/{id}/url:
    get:
      operationId: getFileSignedUrl
      tags: [files]
      summary: Presigned URL GET (1 jam).
      description: 'Permission: system.files.signedurl. `?inline=1` untuk preview (PDF iframe/image img); default attachment. 404 bila file absen/soft-deleted. Kompatibilitas — FE kini memakai /raw.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: inline
          in: query
          required: false
          description: '1/true = preview inline; selain itu attachment.'
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
