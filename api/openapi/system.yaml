        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Patch umum tenant.
      description: 'Permission: system.tenants.update. Semua field opsional KECALI `version` (wajib di body bila tanpa If-Match) — tidak cocok = 412 SYS-412. Tanpa event tenant (patch umum); hasil version +1. Rule zod: paketTier opsional (tanpa default di update).'
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantUpdate' }
      responses:
        '200':
          description: Tenant ter-update.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '412': { $ref: '#/components/responses/Problem412' }
