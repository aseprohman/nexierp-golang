# =============================================================================
# api/openapi/system.yaml — kontrak kawat 130 endpoint modul core/system.
# Sumber fakta (READ-ONLY):
#   - apps/api/src/modules/core/controllers/{iam,rbac,security,tenants,files,
#     wilayah,wilayah_admin,cluster,agama}/*.controller.ts (NestJS)
#   - packages/schemas/src/core/*.ts (zod — satu sumber DTO/view)
#   - kanonik izin: (gel-1) system-routes.txt 130 baris
#     `method uri_pattern -> permission_code` — path & method 1:1 dengannya.
#
# CATATAN PATH: paths di sini TANPA prefix global /api — GATEWAY menyisipkan
# /api di depan (padanan setGlobalPrefix("api") NestJS; guard RBAC mencocokkan
# uri_pattern core_routes setelah prefix dibuang). Contoh: /system/roles
# diakses via <gateway>/api/system/roles.
#
# Envelope sukses PERSIS NestJS ({ data, meta? }):
#   - OK biasa   : { data }            (required [data])
#   - Page       : { data: [], meta: { page, limit, total, totalPages } }
#   - Tenants    : { rows, total }     (khusus GET /system/tenants)
# Error PERSIS ProblemExceptionFilter NestJS: problem+json RFC 7807.
# ==============================================================================
openapi: 3.1.0

info:
  title: NEXIERP API — Core/System
  version: 1.0.0
  description: |
    Kontrak kawat modul core/system: IAM (menu, permission SET, route registry,
    user-override, data-scope), RBAC (users, roles, modules, overview, health),
    Security (sessions, login-audit, MFA, password-history, IP allowlist),
    Environment, Audit Trail, Tenants (siklus hidup, modul/fitur, settings,
    anggota), Files (media library), Wilayah (lookup + admin), Cluster, Agama.

    ## Prefix gateway
    Semua path di dokumen ini TANPA prefix `/api` — **gateway menyisipkan
    `/api`** di depan (setGlobalPrefix NestJS). `/system/roles` di sini =
    `/api/system/roles` di jaringan.

    ## Autentikasi (keduanya didukung — OR)
    1. `Authorization: Bearer <jwt>` (bearerAuth) — guard membaca header.
    2. Cookie sesi httpOnly `nexierp_at` (cookieAuth) — dipakai browser FE
       (mis. preview media `GET /system/files/{id}/raw` via `<img src>`).
    Seluruh 130 endpoint diwajibkan sesi aktif + permission route-centric:
    guard mencocokkan `(method, path)` → `permission_code` di core_routes
    (`system.<fitur>.<action>`); tanpa @RequirePermission per-handler.

    ## Envelope & error
    Sukses = `{"data": ...}` (+`meta` untuk halaman; khusus daftar tenant =
    `{"rows": [...], "total": n}`). Error = dokumen RFC 7807
    `application/problem+json` (schema `Problem`): 400 VAL-400 (zod/param),
    401/403 (auth/permission), 404 SYS-404/NOTF-404/WLY-005, 409 SYS-409/WLY-*,
    412 SYS-412 (If-Match). Kode error modul wilayah: WLY-001..005.

    ## Optimistic locking
    Master baru (tenant, datascope, wilayah admin, kategori media) memakai
    kolom `version`: PATCH/DELETE membawa `If-Match: "<version>"` atau field
    `version` di body — bentrok = 412 (SYS-412) atau 409 (WLY-002/VERSI_BENTROK).

    ## Catatan status POST
    Status sukses mengikuti kontrak decorator `@ApiZodOk` (200 default, 201
    bila dinyatakan). POST Nest tanpa `@HttpCode` eksplisit (mis. suspend/
    reactivate/close tenant, enable/disable modul, routes/reload, POST
    user-overrides) berjalan 201 di runtime — klien disarankan menerima
    200 maupun 201.

servers:
  - url: /
    description: Gateway menyisipkan prefix /api di depan setiap path di bawah.
  - url: http://localhost:3101/api
    description: Dev langsung ke API (prefix /api disertakan di URL server).

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: iam
    description: Menu, fitur, SET permission, route registry, user-override, data-scope (system.iam.*).
  - name: rbac
    description: Pengguna, role, registry modul, overview, health (system.rbac.*).
  - name: security
    description: Sesi, log login, MFA, riwayat password, IP allowlist (system.security.*).
  - name: environment
    description: Konfigurasi environment, logo, uji SMTP (system.security.environment.*).
  - name: audit-trail
    description: Audit trail pusat append-only + ekspor CSV (system.security.*).
  - name: tenants
    description: Registry & siklus hidup tenant, modul/fitur, settings, anggota (system.tenants.*).
  - name: files
    description: Media library terpusat + kategori (system.files.*).
  - name: wilayah
    description: Lookup referensi wilayah Indonesia — READ-ONLY (system.wilayah.*).
  - name: wilayah-admin
    description: CRUD referensi wilayah (SET system.wilayah_admin — terpisah dari lookup).
  - name: cluster
    description: Cluster modul + sinkronisasi modul/fitur (system.cluster.*).
  - name: agama
    description: Kosakata agama resmi (system.agama.*).

paths:
  # ==========================================================================
  # AGAMA (system.agama.*) — 5 endpoint
  # ==========================================================================
  /system/agama:
    get:
      operationId: listAgama
      tags: [agama]
      summary: Daftar agama (paging).
      description: 'Permission: system.agama.list. Halaman agama hidup (deleted_at IS NULL) — default urut urutan, id. Query tidak sah = 400 VAL-400.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          required: false
          description: Filter status hidup.
          schema: { $ref: '#/components/schemas/StatusAktif' }
      responses:
        '200':
          description: Halaman agama.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AgamaView' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      operationId: createAgama
      tags: [agama]
      summary: Buat agama baru.
      description: 'Permission: system.agama.create. code unik di antara baris hidup — duplikat = 409 SYS-409. urutan default 0, status default AKTIF; rule zod: code 1..50, nama 1..100.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgamaCreate' }
      responses:
        '201':
          description: Agama dibuat (version 1, entity_id uuid acak).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AgamaView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
  /system/agama/{id}:
    get:
      operationId: getAgama
      tags: [agama]
      summary: Detail satu agama hidup.
      description: 'Permission: system.agama.detail. Soft delete aware — 404 bila absen/terhapus (SYS-404).'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Detail agama.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AgamaView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
    patch:
      operationId: updateAgama
      tags: [agama]
      summary: Patch umum agama.
      description: 'Permission: system.agama.update. Semua field opsional KECALI `version` (wajib di body bila tanpa If-Match). Versi bentrok / kode duplikat = 409 SYS-409. Hasil: version +1.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgamaUpdate' }
      responses:
        '200':
          description: Agama ter-update — jejak lewat audit trail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AgamaView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
    delete:
      operationId: deleteAgama
      tags: [agama]
      summary: Soft delete agama.
      description: 'Permission: system.agama.remove. Set deleted_at (JANGAN hard delete) — 409 SYS-409 bila masih dirujuk ppdb_pendaftaran/akd_siswa (FK RESTRICT; pakai status NONAKTIF).'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Agama terhapus lunak.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DeletedId' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }

  # ==========================================================================
  # AUDIT TRAIL (system.security.*) — 3 endpoint
  # ==========================================================================
  /system/audit-trail:
    get:
      operationId: listAuditTrail
      tags: [audit-trail]
      summary: Halaman audit trail (filter + paging).
      description: 'Permission: system.security.list. Filter moduleKey/severity/action/query/dateFrom/dateTo + paging standard. dateFrom/dateTo format awal ISO `YYYY-MM-DD`.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit20'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/FilterK'
        - name: moduleKey
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ModuleKey' }
        - name: severity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AuditSeverity' }
        - name: action
          in: query
          required: false
          description: Filter aksi persis (mis. `user_permission`).
          schema: { type: string, minLength: 1 }
        - name: query
          in: query
          required: false
          description: Pencarian teks bebas — aktor, entitas, aksi, modul.
          schema: { type: string }
        - name: dateFrom
          in: query
          required: false
          description: 'Tanggal ISO (YYYY-MM-DD…).'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}' }
        - name: dateTo
          in: query
          required: false
          description: 'Tanggal ISO (YYYY-MM-DD…).'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}' }
      responses:
        '200':
          description: Halaman audit trail.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditTrailEntry' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /system/audit-trail/actions:
    get:
      operationId: listAuditActions
      tags: [audit-trail]
      summary: Opsi dropdown aksi (DISTINCT).
      description: 'Permission: system.security.actions. Daftar aksi distinct audit trail — maks 200, urut abjad.'
      responses:
        '200':
          description: Daftar aksi.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: string, minLength: 1 }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /system/audit-trail/export:
    get:
      operationId: exportAuditTrailCsv
      tags: [audit-trail]
      summary: Ekspor audit trail ke CSV.
      description: 'Permission: system.security.exportcsv. Body mentah CSV + header `Content-Disposition: attachment` (maks 50.000 baris). Aksi ekspor ini tercatat di trail. Filter sama dengan GET /system/audit-trail (tanpa paging).'
      parameters:
        - name: moduleKey
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ModuleKey' }
        - name: severity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AuditSeverity' }
        - name: action
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}' }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}' }
      responses:
        '200':
          description: Berkas CSV audit trail (attachment).
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }

  # ==========================================================================
  # CLUSTER (system.cluster.*) — 8 endpoint
  # ==========================================================================
  /system/cluster:
    get:
      operationId: listCluster
      tags: [cluster]
      summary: Daftar cluster (paging).
      description: 'Permission: system.cluster.list. Halaman cluster hidup (deleted_at IS NULL) — jumlahModul = count assignment hidup; default urut urutan, id. Query tidak sah = 400 VAL-400.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/Sort'
        - name: search
          in: query
          required: false
          description: Cari code/nama cluster (ILIKE), maks 120.
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StatusAktif' }
      responses:
        '200':
          description: Halaman cluster.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClusterView' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      operationId: createCluster
      tags: [cluster]
      summary: Buat cluster baru.
      description: 'Permission: system.cluster.create. code unik di antara baris hidup — duplikat = 409 SYS-409. Rule zod: code 1..50, nama 1..100, deskripsi ≤200, icon ≤50, tone ≤100, urutan ≥0 (default 0), status default AKTIF.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClusterCreate' }
      responses:
        '201':
          description: Cluster dibuat (version 1, entity_id uuid acak, jumlahModul 0).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ClusterView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
  /system/cluster/modul-options:
    get:
      operationId: getClusterModulOptions
      tags: [cluster]
      summary: Katalog modul + fitur aktif (UI assign).
      description: 'Permission: system.cluster.moduloptions. SEMUA modul core_modules (urut key) + fitur aktif (core_modules_features is_active) per modul. Route statis dideklarasikan sebelum /{id}.'
      responses:
        '200':
          description: Katalog modul & fitur.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClusterModulOption' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
  /system/cluster/{id}:
    get:
      operationId: getCluster
      tags: [cluster]
      summary: Detail cluster + modul & fitur ter-assign.
      description: 'Permission: system.cluster.detail. modul = assignment hidup (join core_modules, urut key) dengan fiturIds hidup per assignment. 404 bila absen (SYS-404).'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Detail cluster.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ClusterDetail' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
    patch:
      operationId: updateCluster
      tags: [cluster]
      summary: Patch umum cluster.
      description: 'Permission: system.cluster.update. Semua field opsional KECALI `version` (wajib di body bila tanpa If-Match). Versi bentrok / kode duplikat = 409 SYS-409. Hasil: version +1.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClusterUpdate' }
      responses:
        '200':
          description: Cluster ter-update.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ClusterView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
    delete:
      operationId: deleteCluster
      tags: [cluster]
      summary: Soft delete cluster.
      description: 'Permission: system.cluster.remove. Set deleted_at — tidak lagi muncul di daftar/detail.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Cluster terhapus lunak.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DeletedId' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /system/cluster/{id}/modul:
    put:
      operationId: syncClusterModul
      tags: [cluster]
      summary: REPLACE set modul cluster.
      description: 'Permission: system.cluster.syncmodul. `modulIds` = id core_modules pengganti SELURUH set assignment hidup (dedupe server) — semua id wajib dikenal (400 bila ada yang tak dikenal). Baris lama hilang soft-delete, pasangan baru revive/insert.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClusterModulSync' }
      responses:
        '200':
          description: Set ter-REPLACE — hasil ter-refresh dengan fiturIds.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClusterModulView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
  /system/cluster/modul/{idModulCluster}/fitur:
    put:
      operationId: syncClusterFitur
      tags: [cluster]
      summary: REPLACE set fitur satu baris cluster-modul.
      description: 'Permission: system.cluster.syncfitur. `fiturIds` = id core_modules_features pengganti SELURUH set fitur hidup baris itu — wajib milik modul parent (400 bila bukan). Parent (idModulCluster) wajib hidup.'
      parameters:
        - $ref: '#/components/parameters/IdModulClusterParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClusterFiturSync' }
      responses:
        '200':
          description: Set fitur ter-REPLACE — hasil ter-refresh (id fitur hidup, urut).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [idModulCluster, fiturIds]
                    properties:
                      idModulCluster: { type: integer, minimum: 1 }
                      fiturIds:
                        type: array
                        items: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

  # ==========================================================================
  # DATASCOPE (system.iam.datascope.*) — 10 endpoint
  # ==========================================================================
  /system/datascope/assignments:
    post:
      operationId: createScopeAssignment
      tags: [iam]
      summary: Buat pemberian scope ke role ATAU user (XOR).
      description: 'Permission: system.iam.createassignment. Tepat salah satu `role_id`/`user_id` wajib terisi (XOR — CHECK DB). Duplikat pasangan (definisi, subjek) = 409 SYS-409. Rule zod: note ≤200.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopeAssignmentCreate' }
      responses:
        '201':
          description: Assignment dibuat (aktif, tanpa nilai = deny-all).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ScopeAssignmentView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
  /system/datascope/assignments/{id}:
    patch:
      operationId: updateScopeAssignment
      tags: [iam]
      summary: Ubah assignment (is_active/note).
      description: 'Permission: system.iam.updateassignment. Semua field opsional; If-Match `version` — tidak cocok = 412 SYS-412. Hasil: version +1.'
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopeAssignmentUpdate' }
      responses:
        '200':
          description: Assignment ter-update.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ScopeAssignmentView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
