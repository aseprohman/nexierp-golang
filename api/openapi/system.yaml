  # ==========================================================================
  # MENUS (system.iam.*) — 5 endpoint
  # ==========================================================================
  /system/menus:
    get:
      operationId: listMenus
      tags: [iam]
      summary: Daftar menu (flat atau tree).
      description: 'Permission: system.iam.list. `?tree=1` → nested (MenuTreeNode); default datar. `?module=<key>` hanya menu milik modul (JOIN core_modules.key).'
      parameters:
        - name: tree
          in: query
          required: false
          description: '`1` → nested tree (children), default datar.'
          schema: { type: string, enum: ['1'] }
        - name: module
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Menu datar atau nested (bila tree=1).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - type: array
                        items: { $ref: '#/components/schemas/Menu' }
                        description: Daftar datar.
                      - type: array
                        items: { $ref: '#/components/schemas/MenuTreeNode' }
                        description: Tree nested (tree=1).
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      operationId: createMenu
      tags: [iam]
      summary: Tambah menu.
      description: 'Permission: system.iam.create. Rule zod: text 1..100 wajib; urlPath 0..255 (null = grup/heading); externalHref ≤255 (link eksternal); parent/order/icon/idCoreModules opsional; cssClass ≤30.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMenu' }
