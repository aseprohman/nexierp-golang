  # ==========================================================================
  # TENANTS (system.tenants.*) — 20 endpoint
  # ==========================================================================
  /system/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: Daftar tenant (paging).
      description: 'Permission: system.tenants.list. Envelope khusus `{ rows, total }` — hanya tenant hidup (deleted_at IS NULL), urut id. Rule zod: search trim ≤120; status/tier enum.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit20'
        - name: search
          in: query
          required: false
          description: Cari kode/nama (ILIKE), maks 120.
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StatusTenant' }
        - name: tier
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PaketTier' }
      responses:
        '200':
          description: Daftar tenant + jumlah.
          content:
            application/json:
              schema:
                type: object
                required: [rows, total]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/TenantView' }
                  total: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Provisio tenant baru.
      description: 'Permission: system.tenants.create. Status awal PROVISI + preset modul/fitur global (snapshot katalog); event PROVISI dicatat. Rule zod: kode trim 3..50 regex ^[a-z0-9][a-z0-9._-]*$ (lowercase unik via API); nama trim 2..100; paketTier default PS2; maxUsers/maxLokasi ≥0 nullable; kontakEmail email ≤150; kontakTelepon ≤50.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
      responses:
        '201':
          description: Tenant dibuat (PROVISI).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TenantView' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
  /system/tenants/context:
    get:
      operationId: getTenantContext
      tags: [tenants]
      summary: Tenant milik user saat ini (switcher FE).
      description: 'Permission: system.tenants.context. Keanggotaan aktif user JWT (dicabut_pada NULL) pada tenant hidup — default user paling atas. Route statis sebelum /{id}.'
